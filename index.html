<style>
/* Layout: sticky role bar on top, one centred working column per role (wider for the company desk). */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --sunk:#EAECEF; --ink:#15171C; --muted:#585E6B; --line:#DFE2E7;
  --accent:#C2410C; --on-accent:#FFFFFF; --accent-soft:#FDEBDD; --accent-ink:#9A3412; --brand:#F47B20; --brand-ink:#2E3A46;
  --ok:#15803D; --ok-soft:#E3F2E8; --ok-ink:#14532D; --info-soft:#E0E7FF; --info-ink:#1E3A8A;
  --warn-soft:#FEF3C7; --warn-ink:#854D0E; --map:#E3E6EB; --road:#FFFFFF; --park:#D3E5D4; --sea:#CFE0EC; --land:#F4F2EC; --border:#D6D0C2; --truck-back:#64748B; --bin-on:#15803D; --bin-pick:#DC2626; --bin-swap:#D97706;
  --paper:#FFFFFF; --paper-ink:#111111; --shadow:0 10px 30px rgba(21,23,28,.14);
  --f-display:'Commissioner', 'Segoe UI', system-ui, sans-serif;
  --f-body:'Commissioner', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#1A1D23; --sunk:#13161B; --ink:#F2F3F5; --muted:#A3A9B6; --line:#2C3039;
  --accent:#FB923C; --on-accent:#1A0D05; --accent-soft:#3A1F0E; --accent-ink:#FDBA74; --brand:#F47B20; --brand-ink:#E6E9EE;
  --ok:#4ADE80; --ok-soft:#0F2A1A; --ok-ink:#86EFAC; --info-soft:#172554; --info-ink:#BFDBFE;
  --warn-soft:#3B2A06; --warn-ink:#FDE68A; --map:#1F232B; --road:#323844; --park:#1E3324; --sea:#0D1822; --land:#20242B; --border:#363B45; --truck-back:#8A97AB; --bin-on:#4ADE80; --bin-pick:#F87171; --bin-swap:#FBBF24;
  --paper:#FFFFFF; --paper-ink:#111111; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#1A1D23; --sunk:#13161B; --ink:#F2F3F5; --muted:#A3A9B6; --line:#2C3039;
  --accent:#FB923C; --on-accent:#1A0D05; --accent-soft:#3A1F0E; --accent-ink:#FDBA74; --brand:#F47B20; --brand-ink:#E6E9EE;
  --ok:#4ADE80; --ok-soft:#0F2A1A; --ok-ink:#86EFAC; --info-soft:#172554; --info-ink:#BFDBFE;
  --warn-soft:#3B2A06; --warn-ink:#FDE68A; --map:#1F232B; --road:#323844; --park:#1E3324; --sea:#0D1822; --land:#20242B; --border:#363B45; --truck-back:#8A97AB; --bin-on:#4ADE80; --bin-pick:#F87171; --bin-swap:#FBBF24;
  --paper:#FFFFFF; --paper-ink:#111111; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em}
.h1{font-size:clamp(24px,5vw,32px);font-weight:800;line-height:1.12}
.h2{font-size:20px;font-weight:800}
.h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}

function freeVehs(cid,date){date=date||ymd(new Date());const co=D.companies[cid]||{};return Object.entries(D.drivers).filter(([,d])=>d.companyId===cid&&d.vehicle).map(([did,d])=>{const l=leaveOn(d,date);const v=l&&(co.vehicles||[]).find(x=>x.plate===d.vehicle);return v?{v,d,did,l}:null}).filter(Boolean)}

/* ---------- automatic assignment ----------

/* ---------- pickup on the way back ----------

function comboCheck(did,base,w,pick){const co=D.companies[D.drivers[did].companyId];const H=coHours(co);const today=ymd(new Date());const M=autoMargin(did);

const dispatched={};
function autoDispatch(){if(loaded<NEED)return;const now=Date.now();
  const q=ordersArr().filter(o=>{const co=D.companies[o.companyId];return co&&!co.solo&&co.autoAssign!==false&&(o.status==='pickup'||(o.status==='accepted'&&!o.driverId))})

/* ---------- map: Greek municipalities drawn as land, trucks on top ---------- */
let GMAP=null,gmapState=0;
function loadGMap(){if(gmapState)return;gmapState=1;
  fetch('greece-map.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{const q=j.q;
    GMAP=j.r.map(([x0,y0,x1,y1,s])=>{const a=s.split(',').map(Number);let x=a[0],y=a[1];const pts=[[x/q,y/q]];for(let i=2;i<a.length;i+=2){x+=a[i];y+=a[i+1];pts.push([x/q,y/q])}return{b:[x0/q,y0/q,x1/q,y1/q],pts}});
    gmapState=2;scheduleRender()}).catch(()=>{gmapState=3})}
const projXY=(pr,p)=>[(p.lng-pr[0])*pr[2]*pr[3]+pr[4],(pr[1]-p.lat)*pr[2]+pr[5]];
const TRUCK_GLYPH='<path d="M-7 -4h8v7h-8zM1 -1h3.5l2.5 2.5v2.5h-6" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round"/>';
function truckMark(tr,pr){const [x,y]=projXY(pr,tr.pos);
  return `<g class="trk st-${tr.state}" data-truck="${tr.tid}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="${tr.big?13:11}" stroke-width="2.5"/>${TRUCK_GLYPH}${tr.label?`<text y="${tr.big?25:22}" text-anchor="middle" class="tlab">${esc(tr.label)}</text>`:''}</g>`}
function liveMap(o){loadGMap();const W=360,H=o.h||220;
  const all=[...o.pts,...o.trucks.map(t=>t.pos),...(o.path||[])].filter(p=>p&&isFinite(p.lat));if(!all.length)all.push(ATH);
  const la=all.map(p=>p.lat),ln=all.map(p=>p.lng);const la0=Math.min(...la),la1=Math.max(...la),ln0=Math.min(...ln),ln1=Math.max(...ln);
  const cy=(la0+la1)/2,cx=(ln0+ln1)/2,kx=Math.cos(cy*Math.PI/180);const span=o.minSpan||.03;
  const s=Math.min(W*.78/Math.max((ln1-ln0)*kx,span),H*.7/Math.max(la1-la0,span*H/W));
  const pr=[cx,cy,s,kx,W/2,H/2];const vb=[cx-W/2/(s*kx),cy-H/2/s,cx+W/2/(s*kx),cy+H/2/s];
  const inPoly=(pt,P)=>{let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c};
  const hp=o.hl&&isFinite(o.hl.lat)?[o.hl.lng,o.hl.lat]:null;
  let land='',hl='';if(GMAP)GMAP.forEach(r=>{if(r.b[2]<vb[0]||r.b[0]>vb[2]||r.b[3]<vb[1]||r.b[1]>vb[3])return;let d='',lx=-1e9,ly=-1e9;
    r.pts.forEach((p,i)=>{const x=(p[0]-cx)*s*kx+W/2,y=(cy-p[1])*s+H/2;if(i&&Math.abs(x-lx)<1.4&&Math.abs(y-ly)<1.4)return;d+=(d?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);lx=x;ly=y});land+=d+'Z';
    if(hp&&hp[0]>=r.b[0]&&hp[0]<=r.b[2]&&hp[1]>=r.b[1]&&hp[1]<=r.b[3]&&inPoly(hp,r.pts))hl+=d+'Z'});
  const placed=[];let labs='';Object.entries(DCOORD).map(([d,p])=>({d,p,xy:projXY(pr,{lat:p[0],lng:p[1]})})).filter(z=>z.xy[0]>24&&z.xy[0]<W-24&&z.xy[1]>14&&z.xy[1]<H-8&&!o.pts.some(q=>{const a=projXY(pr,q);return Math.abs(a[0]-z.xy[0])<34&&z.xy[1]-a[1]>-30&&z.xy[1]-a[1]<14}))
    .sort((a,b)=>Math.hypot(a.xy[0]-W/2,a.xy[1]-H/2)-Math.hypot(b.xy[0]-W/2,b.xy[1]-H/2)).forEach(z=>{if(placed.length>=9||placed.some(q=>Math.abs(q[0]-z.xy[0])<70&&Math.abs(q[1]-z.xy[1])<16))return;placed.push(z.xy);
      labs+=`<text x="${z.xy[0].toFixed(0)}" y="${z.xy[1].toFixed(0)}" text-anchor="middle" class="mlab">${esc(SEAT[z.d]||z.d)}</text>`});
  const P=p=>projXY(pr,p).map(n=>n.toFixed(1)).join(',');
  const route=o.path&&o.path.length>1?`<polyline class="route" points="${o.path.map(P).join(' ')}" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 7"/>`:'';
  const pts=o.pts.map(p=>{const [x,y]=projXY(pr,p);
    if(p.kind==='depot')return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="-9" y="-9" width="18" height="18" rx="5" class="ink"/><path d="M-5 4V-1l5-4 5 4v5" fill="none" class="bgstroke" stroke-width="1.8" stroke-linejoin="round"/>${p.label?`<text y="21" text-anchor="middle" class="tlab">${esc(p.label)}</text>`:''}</g>`;
    if(p.kind==='bin')return `<g class="binm b-${p.st}" data-act="coOpenReq" data-v="${p.id}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" role="button" aria-label="${esc(p.label)}"><title>${esc(p.label)}</title><circle r="13" fill="transparent"/><path d="M-8 -5H8L6 6H-6Z" ${p.color?(p.st==='topl'?`style="fill:var(--surface);stroke:${p.color};stroke-width:2.2;stroke-dasharray:3 2"`:`style="fill:${p.color}"`):''}/></g>`;
    if(p.kind==='co')return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" opacity="${p.dim?.45:1}"><circle r="13" fill="${p.tint}" stroke="#FFFFFF" stroke-width="2"/><text y="3.5" text-anchor="middle" class="nlab" style="font-size:9px">${esc(p.label)}</text></g>`;
    if(p.kind==='num')return `<g class="nk nk-${p.k||'delivery'}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="9" stroke="#FFFFFF" stroke-width="2"/><text y="3.5" text-anchor="middle" class="nlab">${p.n}</text></g>`;
    if(p.kind==='dot')return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" class="acc" stroke="#FFFFFF" stroke-width="2"/>`;
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><path class="acc" d="M0 0c-7-9-11-14-11-19a11 11 0 0122 0c0 5-4 10-11 19z"/><circle cy="-19" r="4" fill="#FFFFFF"/>${p.label?`<text y="13" text-anchor="middle" class="tlab">${esc(p.label)}</text>`:''}</g>`}).join('');
  return `<div class="map live-map"><svg viewBox="0 0 ${W} ${H}" data-proj='${JSON.stringify(pr.map(n=>+n.toFixed(6)))}' role="img" aria-label="${esc(o.aria||'Χάρτης')}">
   <rect class="sea" width="${W}" height="${H}"/>${land?`<path class="land" d="${land}"/>`:''}${hl?`<path class="land-hl" d="${hl}"/>`:''}${labs}${route}${pts}${o.trucks.map(t=>truckMark(t,pr)).join('')}</svg>
   ${o.tag?`<span class="map-tag"><span class="dot"></span>${o.tag}</span>`:''}<span class="map-src">Όρια: geoBoundaries</span></div>`}
function trucksOf(cid,filter){const co=D.companies[cid]||{};const now=Date.now();
  return (co.vehicles||[]).map(v=>{const live=vehLive(cid,v.plate,now);return{tid:trackId(cid,v.plate),plate:v.plate,pos:live.pos,state:live.state,label:v.plate,live}}).filter(filter||(()=>true))}
/* the map of one job: customer, driver and company all see this */
function jobMap(o,opts){opts=opts||{};const co=D.companies[o.companyId];const g=geoOf(o);const t=orderTrack(o);const pts=[{lat:g.lat,lng:g.lng,kind:'dest',label:opts.destLabel||''}];
  const trucks=[];let path=null;
  if(t){const n=trackNow(t,Date.now());trucks.push({tid:trackId(o.companyId,t.plate),pos:n.pos,state:t.state==='out'&&n.f<1?'out':'stop',big:true,label:opts.plate?t.plate:''});
    if(t.state==='out'&&n.f<1){path=restPath(t.path,n.f,n.pos);if(t.path.length>2&&path.length>2)pts.push({...depotOf(co),kind:'depot'})}}
  else if(opts.depot)pts.push({...depotOf(co),kind:'depot',label:'Βάση'});
  const e=t&&t.state==='out'?trackNow(t,Date.now()):null;
  return liveMap({pts,trucks,path,h:opts.h||210,minSpan:.02,aria:'Χάρτης παράδοσης',tag:e?(e.gps?'Live GPS':'Live · επίδειξη ×'+SIM):opts.tag||''})}
function tickDom(now){
  document.querySelectorAll('[data-truck]').forEach(g=>{const t=D.tracks[g.dataset.truck];const svg=g.ownerSVGElement;if(!t||!svg)return;
    const pr=svg.__pr||(svg.__pr=JSON.parse(svg.dataset.proj));const l=vehLive(t.cid,t.plate,now);const [x,y]=projXY(pr,l.pos);g.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+')')});
  document.querySelectorAll('[data-prog]').forEach(el=>{const id=el.dataset.prog;const o=D.orders[id];if(o)el.style.width=Math.round(progOf(Object.assign({id},o))*100)+'%'});
  document.querySelectorAll('[data-eta]').forEach(el=>{const id=el.dataset.eta;const o=D.orders[id];if(!o)return;const e=etaOf(Object.assign({id},o));if(!e||!e.moving)return;
    const f=el.dataset.fmt;el.textContent=f==='clock'?clk(e.clock):f==='km'?kmTxt(e.km):f==='pct'?Math.round(progOf(Object.assign({id},o))*100)+'%':minTxt(e.min)});
  document.querySelectorAll('[data-vrem]').forEach(el=>{const t=D.tracks[el.dataset.vrem];if(!t)return;const l=vehLive(t.cid,t.plate,now);if(l.state==='out'||l.state==='back')el.textContent=minTxt(l.remain)})}

/* ---------- rendering ---------- */
let rq=false,pending=false,selectDone=false;
function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function render(){
  const a=document.activeElement;
  if(a&&a.tagName==='SELECT'&&$app.contains(a)&&!selectDone){pending=true;return}
  if(drawing){pending=true;return}
  const id=a&&a.id;let s1=null,s2=null;try{s1=a.selectionStart;s2=a.selectionEnd}catch(e){}
  $app.innerHTML=header()+'<div class="wrap'+(['company','platform'].includes(ui.role)?' wide':'')+(['customer','company','driver'].includes(ui.role)?' has-bnav':'')+'">'+body()+'</div>';
  if(id){const el=document.getElementById(id);if(el&&el.tagName!=='BUTTON'){el.focus({preventScroll:true});try{if(s1!=null)el.setSelectionRange(s1,s2)}catch(e){}}}
  drawSig();
  ['.rq-stages .on','.day-chips .on'].forEach(q=>{const tb=document.querySelector(q);if(!tb)return;const c=tb.parentElement;const r=tb.getBoundingClientRect(),cr=c.getBoundingClientRect();if(r.left<cr.left||r.right>cr.right)c.scrollLeft+=r.left-cr.left-8});
}

function header(){
  const n=unread(ui.role);
  const label=mode==='live'?liveLabel():mode==='shared'?'<span class="dot"></span>Live · κοινά δεδομένα':mode==='local'?'<span class="dot off"></span>Δοκιμή σε αυτή τη συσκευή':mode==='offline'?'<span class="dot off"></span>Εκτός σύνδεσης':'<span class="dot off"></span>Σύνδεση…';
  const roles=roleList().map(([r,l])=>`<button data-act="role" data-v="${r}" class="${ui.role===r?'on':''}" aria-pressed="${ui.role===r}">${l}</button>`).join('');
  return `<header class="top"><div class="top-in" style="position:relative">
   <div class="brand"><span class="blogo" role="img" aria-label="BazaGo"><img class="bm lg-l" src="${LOGO.ml}" alt=""><img class="bm lg-d" src="${LOGO.md}" alt=""></span><span class="bcol"><span class="bword"><img class="lg-l" src="${LOGO.wl}" alt="BazaGo"><img class="lg-d" src="${LOGO.wd}" alt="BazaGo"></span><small>${label}</small></span></div>
   <div class="roles" aria-label="Ρόλος">${roles}</div>
   <button class="icon-btn" data-act="notif" aria-label="Ειδοποιήσεις" aria-expanded="${notifOpen}">${icon.bell}${n?`<span class="badge">${n}</span>`:''}</button>
   ${notifOpen?notifPanel():''}
  </div></header>`;
}
let notifPrev='';
const NOTIF_IC=n=>n.veh?icon.truck:n.rent?'€':n.who==='driver'?icon.truck:n.who==='company'?icon.receipt:n.who==='customer'?icon.user:icon.bell;
function notifPanel(){
  const list=notifList(ui.role).slice(0,30);
  const who={customer:'Πελάτης',company:'Εταιρία',driver:'Οδηγός',system:'Ενοικίαση',fleet:'Στόλος'};
  const day=x=>{const d=new Date(x),t=new Date();return d.toDateString()===t.toDateString()?hhmm(x):d.getDate()+'/'+(d.getMonth()+1)};
  return `<div class="notif" role="dialog" aria-label="Ειδοποιήσεις"><div class="row between" style="padding:6px 8px"><b>Ειδοποιήσεις</b><button class="icon-btn" data-act="notif" aria-label="Κλείσιμο">${icon.x}</button></div>
  ${list.length?list.map(n=>`<button class="it ${n.at>notifPrev?'new':''} ${n.rent?'rent':''}" data-act="notifGo" data-v="${n.oid}"><span class="n-ic" aria-hidden="true">${NOTIF_IC(n)}</span><span class="grow" style="min-width:0;display:flex;flex-direction:column;gap:2px"><span>${esc(n.text)}</span><span class="xs muted">${day(n.at)} · ${n.veh?'':'#'}${esc(n.code)} · ${esc(ui.role==='customer'?n.place:who[n.who]||'')}</span></span>${n.at>notifPrev?'<span class="n-dot" aria-label="Νέα"></span>':''}</button>`).join(''):'<p class="muted small" style="padding:10px">Δεν υπάρχουν ειδοποιήσεις ακόμα. Εδώ θα βλέπεις κάθε αλλαγή στα αιτήματά σου και τις χρεώσεις ενοικίασης.</p>'}</div>`;
}
function body(){
  if(loaded<NEED)return '<div class="stack"><div class="skeleton"></div><div class="skeleton"></div></div>';
  if(!Object.keys(D.companies).length||!D.customer)return `<div class="card stack"><h1 class="h2">Η πλατφόρμα είναι άδεια</h1><p class="muted">Φόρτωσε εταιρίες, οδηγούς και έναν πελάτη επίδειξης για να δοκιμάσεις όλη τη ροή.</p><button class="btn primary big" data-act="loadDemo">Φόρτωσε δεδομένα επίδειξης</button></div>`;
  let html='';
  if(!LS.get('guideDone',false))html+=`<div class="guide" style="margin-bottom:16px"><div class="grow"><b>Δοκίμασε όλη τη ροή</b><ol><li>Ως <b>Πελάτης</b> κάνε κράτηση κάδου.</li><li>Ως <b>Εταιρία</b> αποδέξου: το σύστημα αναθέτει αυτόματα στο συμβατό φορτηγό που φτάνει πρώτο.</li><li>Ως <b>Οδηγός</b> δες το βελτιστοποιημένο δρομολόγιο, ξεκίνα και ολοκλήρωσε με φωτογραφία και υπογραφή.</li><li>Γύρνα στον Πελάτη για το φορτηγό στον χάρτη, την ώρα άφιξης και τις ειδοποιήσεις.</li></ol><p class="small" style="margin-top:6px">${mode==='shared'?'Άνοιξε τη σελίδα και σε δεύτερη συσκευή με άλλο ρόλο για να βλέπεις τις αλλαγές ζωντανά.':'Τα δεδομένα μένουν σε αυτή τη συσκευή.'}</p></div><button class="icon-btn" data-act="guideDone" aria-label="Απόκρυψη οδηγιών">${icon.x}</button></div>`;
  html+=ui.role==='customer'?customerView():ui.role==='company'?companyView():ui.role==='platform'?platformView():driverView();
  html+=`<div class="footer-tools row-wrap between"><span class="xs muted">Δοκιμαστική έκδοση · ενδεικτικές εταιρίες και τιμές</span>${confirmReset?`<span class="row-wrap"><span class="small">Θα σβηστούν όλες οι παραγγελίες.</span><button class="btn" data-act="resetYes">Ναι, επαναφορά</button><button class="btn" data-act="resetNo">Άκυρο</button></span>`:'<button class="btn link" data-act="reset">Επαναφορά δεδομένων επίδειξης</button>'}</div>`;
  return html;
}

/* ---------- customer ---------- */
function cTitleBar(title,sub){
  const back=ui.c.back.length?`<button class="icon-btn" data-act="cBack" aria-label="Πίσω" style="margin-left:-10px">${icon.back}</button>`:'';
  return `<div class="row">${back}<div class="grow"><h1 class="h2">${esc(title)}</h1>${sub?`<p class="small muted">${esc(sub)}</p>`:''}</div></div>`;
}
function customerView(){
  let v=ui.c.view;if(v==='orders'){v=ui.c.view='projects';ui.c.mbTab='hist'}if(v==='favs')v=ui.c.view='profile';
  const tabs=[['search','Νέος κάδος',icon.search],['projects','Οι κάδοι μου',icon.bin],['profile','Προφίλ',icon.user]];
  const top=['search','results','book'].includes(v)?'search':v==='order'?'projects':v;
  const myActive=relevant('customer').filter(o=>ACTIVE.includes(o.status)).length;
  let h=`<nav class="bnav" aria-label="Ενότητες πελάτη"><div class="bnav-in three">${tabs.map(([k,l,ic])=>`<button class="${top===k?'on':''}" data-act="cTab" data-v="${k}" aria-current="${top===k?'page':'false'}">${ic}<span>${l}</span>${k==='projects'&&myActive?`<span class="badge">${myActive}</span>`:''}</button>`).join('')}</div></nav>`;
  if(v==='search')h+=cSearch();else if(v==='results')h+=cResults();else if(v==='book')h+=cBook();else if(v==='order')h+=cOrder();
  else if(v==='profile')h+=cProfile();else h+=cProjects();
  return h;

function placementsOf(o){const s0=placedAt(o);if(!s0)return [];const sw=o.swaps||[];const swapSum=sw.reduce((a,x)=>a+(x.price||0),0);const end=doneAt(o);const rows=[];let start=s0;const xg=Math.round((o.extraRent||0)*1.24);

  const co=D.companies[o.companyId]||{};const z=(co.areas||[]).find(a=>a.id===o.area)||(co.areas||[])[0];const pr=z&&z.prices&&z.prices[o.size];

/* every order on the platform, by month */
function pfOrders(){const all=ordersArr();const now=curMonth();const months=[...new Set(all.map(o=>monthOf(o.date||o.createdAt)).filter(Boolean).concat([now]))].sort().reverse();
  const m=months.includes(ui.pf.om)?ui.pf.om:now;const os=all.filter(o=>monthOf(o.date||o.createdAt)===m);
  const grp=o=>DONE.includes(o.status)?(o.status==='completed'?'done':'lost'):'open';
  /* η πλατφόρμα δεν βλέπει τι πληρώνει ο πελάτης την εταιρία· μόνο τα δικά της έσοδα (χρέωση ανά τοποθέτηση) */
  const fees=placementFees(null).filter(x=>monthOf(x.start)===m);const T=feeSummary(fees);const feeOf=cid=>feeSummary(fees.filter(x=>x.o.companyId===cid)).net;
  const cos=Object.entries(D.companies).map(([cid,co])=>{const L=os.filter(o=>o.companyId===cid);return{cid,co,n:L.length,open:L.filter(o=>grp(o)==='open').length,done:L.filter(o=>grp(o)==='done').length,lost:L.filter(o=>grp(o)==='lost').length,v:feeOf(cid)}}).filter(r=>r.n).sort((a,b)=>b.n-a.n);
  const fc=ui.pf.oc||'',fg=ui.pf.og||'all';const L=os.filter(o=>(!fc||o.companyId===fc)&&(fg==='all'||grp(o)===fg));
  const n=os.length,lost=os.filter(o=>grp(o)==='lost').length;
  return `<div><h1 class="h2">Παραγγελίες</h1><p class="small muted">Όλες οι παραγγελίες της πλατφόρμας, με βάση την ημέρα τοποθέτησης.</p></div>
   <div class="field" style="max-width:240px"><label class="label" for="pf-om">Μήνας</label><select class="input sm" id="pf-om" data-chg="pfSet" data-k="om">${months.map(k=>`<option value="${k}" ${m===k?'selected':''}>${monthLabel(k)}${k===now?' (τρέχων)':''}</option>`).join('')}</select></div>
   <div class="mb-stats st-kpis">${pfKpi(n,'αιτήματα')}${pfKpi(os.filter(o=>grp(o)==='open').length,'σε εξέλιξη')}${pfKpi(os.filter(o=>grp(o)==='done').length,'ολοκληρώθηκαν')}${pfKpi(lost,'ακυρώσεις/απορρίψεις'+(n?' ('+Math.round(lost/n*100)+'%)':''))}${pfKpi(T.n,'τοποθετήσεις')}${pfKpi(eur2(T.net),'έσοδα πλατφόρμας, καθαρά')}</div>
   ${cos.length?`<div class="card stack-s"><b>Ανά εταιρία · ${monthLabel(m)}</b><div class="table-wrap"><table class="st-table" style="min-width:560px"><thead><tr><th>Εταιρία</th><th class="r">Αιτήματα</th><th class="r">Σε εξέλιξη</th><th class="r">Ολοκλ.</th><th class="r">Ακυρ./Απορρ.</th><th class="r">Έσοδα πλατφόρμας</th></tr></thead><tbody>
    ${cos.map(r=>`<tr><td><b>${esc(r.co.name)}</b></td><td class="r num">${r.n}</td><td class="r num">${r.open}</td><td class="r num">${r.done}</td><td class="r num">${r.lost}</td><td class="r num">${eur2(r.v)}</td></tr>`).join('')}</tbody></table></div></div>`:''}
   <div class="card stack-s"><div class="row-wrap between" style="gap:10px;align-items:flex-end"><b>Λίστα</b>
     <div class="row-wrap" style="gap:8px"><select class="input sm" aria-label="Εταιρία" data-chg="pfSet" data-k="oc"><option value="">Όλες οι εταιρίες</option>${Object.entries(D.companies).map(([cid,co])=>`<option value="${cid}" ${fc===cid?'selected':''}>${esc(co.name)}</option>`).join('')}</select>
     <select class="input sm" aria-label="Κατάσταση" data-chg="pfSet" data-k="og">${[['all','Όλες'],['open','Σε εξέλιξη'],['done','Ολοκληρώθηκαν'],['lost','Ακυρώσεις/απορρίψεις']].map(([k,l])=>`<option value="${k}" ${fg===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
    ${L.length?`<div class="table-wrap"><table class="st-table" style="min-width:600px"><thead><tr><th>#</th><th>Ημέρα</th><th>Εταιρία</th><th>Πελάτης</th><th>Κάδος</th><th>Κατάσταση</th></tr></thead><tbody>
    ${L.slice(0,ui.pf.oAll?500:40).map(o=>`<tr><td>${esc(o.code)}</td><td>${esc(o.date?dlabel(o.date):'')}</td><td>${esc((D.companies[o.companyId]||{}).name||'')}</td><td>${esc(o.customerName||'')}<div class="xs muted">${esc(o.address||'')}</div></td><td>${esc(sizeName(o.size))}<div class="xs muted">${esc(matName(o.mat))}</div></td><td>${chip(o.status)}</td></tr>`).join('')}</tbody></table></div>
    ${L.length>40&&!ui.pf.oAll?`<button class="btn link" data-act="pfSetV" data-k="oAll" data-v="1" style="align-self:flex-start">Όλες οι ${L.length}</button>`:''}`:'<span class="small muted">Καμία παραγγελία.</span>'}</div>`}
function pfBilling(){const all=placementFees(null);const now=curMonth();const months=[...new Set(all.map(r=>monthOf(r.start)).concat([now]))].sort().reverse();
  const m=months.includes(ui.pf.m)?ui.pf.m:now;
  const rows=Object.entries(D.companies).map(([cid,co])=>{const r=all.filter(x=>x.o.companyId===cid&&monthOf(x.start)===m);return{cid,co,S:feeSummary(r),st:feeStatus(co,m)}}).sort((a,b)=>b.S.total-a.S.total);
  const T=feeSummary(all.filter(x=>monthOf(x.start)===m));
  const due=Object.entries(D.companies).reduce((a,[cid,co])=>a+months.filter(k=>feeStatus(co,k)==='due').reduce((s,k)=>s+feeSummary(all.filter(x=>x.o.companyId===cid&&monthOf(x.start)===k)).total,0),0);
  const kpi=(v,l)=>`<div class="mb-stat"><b class="num">${v}</b><span class="xs muted">${l}</span></div>`;
  return `<div class="stack"><div><h1 class="h2">Χρεώσεις πλατφόρμας</h1><p class="small muted">Οι πελάτες χρησιμοποιούν την πλατφόρμα δωρεάν. Κάθε εταιρία χρεώνεται ${eur2(PLATFORM_FEE.bin)} ανά τοποθέτηση κάδου και ${eur2(PLATFORM_FEE.container)} ανά κοντέινερ, συν ΦΠΑ 24%.</p></div>
   <div class="row-wrap between" style="gap:10px;align-items:flex-end"><div class="field" style="min-width:200px"><label class="label" for="pf-m">Μήνας</label><select class="input sm" id="pf-m" data-chg="pfSet" data-k="m">${months.map(k=>`<option value="${k}" ${m===k?'selected':''}>${monthLabel(k)}${k===now?' (τρέχων)':''}</option>`).join('')}</select></div>
    <button class="btn sm" data-act="feeCsv" data-c="" data-v="${m}" ${T.n?'':'disabled'}>Εξαγωγή όλων (CSV)</button></div>
   <div class="mb-stats st-kpis">${kpi(T.n,'τοποθετήσεις')}${kpi(T.bins,'κάδοι')}${kpi(T.cont,'κοντέινερ')}${kpi(eur2(T.net),'έσοδα πλατφόρμας, καθαρά')}${kpi(eur2(T.total),'με ΦΠΑ')}${kpi(eur2(due),'προς είσπραξη, όλοι οι μήνες')}</div>
   <div class="card stack-s"><b>Ανά εταιρία · ${monthLabel(m)}</b><div class="table-wrap"><table class="st-table" style="min-width:640px"><thead><tr><th>Εταιρία</th><th class="r">Κάδοι</th><th class="r">Κοντέινερ</th><th class="r">Καθαρό</th><th class="r">ΦΠΑ</th><th class="r">Σύνολο</th><th>Κατάσταση</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><b>${esc(r.co.name)}</b>${r.st!=='open'&&r.S.n?`<div class="xs muted">${invNo(r.cid,m)}</div>`:''}</td><td class="r num">${r.S.bins}</td><td class="r num">${r.S.cont}</td><td class="r num">${eur2(r.S.net)}</td><td class="r num">${eur2(r.S.vat)}</td><td class="r num"><b>${eur2(r.S.total)}</b></td>
     <td>${!r.S.n?'<span class="xs muted">—</span>':r.st==='open'?'<span class="chip t-info">Τρέχων μήνας</span>':`<div class="row-wrap" style="gap:6px">${pfInvCell(r.cid,r.co,m,r.st)}${r.st==='paid'?`<span class="chip t-ok">Εξοφλήθηκε</span> <button class="btn link" data-act="pfPaid" data-c="${r.cid}" data-v="${m}">Αναίρεση</button>`:`<button class="btn sm" data-act="pfPaid" data-c="${r.cid}" data-v="${m}">Σήμανση εξόφλησης</button>`}</div>`}</td></tr>`).join('')}
    <tr class="tot"><td>Σύνολο</td><td class="r num">${T.bins}</td><td class="r num">${T.cont}</td><td class="r num">${eur2(T.net)}</td><td class="r num">${eur2(T.vat)}</td><td class="r num">${eur2(T.total)}</td><td></td></tr></tbody></table></div></div>
   <div class="card flat small">Ο μήνας κλείνει την 1η του επόμενου. Για κάθε εταιρία εκδίδεις το τιμολόγιο της προμήθειας στο λογιστικό σου πρόγραμμα και το ανεβάζεις εδώ (PDF): η εταιρία το βλέπει στο «Προφίλ › Ρυθμίσεις › Χρεώσεις πλατφόρμας» και ειδοποιείται. Όταν πληρώσει, πατάς «Σήμανση εξόφλησης».</div></div>`}

async function exportCsv(name,rows){const csv='﻿'+rows.map(r=>r.map(v=>{const s=String(v==null?'':v);return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\r\n');
  let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads')}catch(e){dl=null}
  if(dl){try{await dl.save({filename:name,data:csv});toast('Το αρχείο '+name+' είναι έτοιμο')}catch(e){if(!e||e.code!=='declined')toast('Το αρχείο δεν αποθηκεύτηκε. Δοκίμασε ξανά.')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Λήψη: '+name)}catch(e){toast('Η λήψη δεν είναι διαθέσιμη σε αυτή την προβολή')}}

const BIZ_KIND={construction:'Τεχνική ή κατασκευαστική εταιρία',retail:'Κατάστημα ή σούπερ μάρκετ',other:'Άλλη επιχείρηση'};
function cprof(){const c=D.customer||{};const p=c.profile||{};
  return{type:p.type==='business'?'business':'private',name:p.name||c.name||'',phone:p.phone||'',email:p.email||'',
    biz:Object.assign({name:'',kind:'construction',afm:'',doy:'',activity:'',address:'',logo:null},p.biz||{}),
    bill:Object.assign({doc:'receipt',name:'',afm:'',doy:'',address:'',email:''},p.bill||{}),
    prefs:Object.assign({street:true,notify:'push'},p.prefs||{})}}
/* what the invoice is issued to: frozen on the order when it is sent */
/* invoice to the business details unless the customer chose other billing details */
const billSame=p=>p.bill.other===undefined?!(p.bill.name||p.bill.afm||p.bill.doy||p.bill.address):!p.bill.other;
function billingOf(){const p=cprof();const sm=billSame(p);const bb=sm?{}:p.bill;if(p.type==='business'&&p.bill.doc==='invoice')return{doc:'invoice',name:bb.name||p.biz.name||p.name,afm:bb.afm||p.biz.afm,doy:bb.doy||p.biz.doy,address:bb.address||p.biz.address,email:p.bill.email||p.email,logo:p.biz.logo||null};
  return{doc:'receipt',name:p.type==='business'?(p.biz.name||p.name):p.name,logo:p.type==='business'?p.biz.logo||null:null}}
const billTxt=b=>!b?'':b.doc==='invoice'?'Τιμολόγιο: '+(b.name||'')+(b.afm?' · ΑΦΜ '+b.afm:''):'Απόδειξη'+(b.name?': '+b.name:'');

     ${fld('biz.name','Επωνυμία',p.biz.name,{ph:'π.χ. Παπαδόπουλος Κατασκευαστική Α.Ε.'})}
     <div class="field"><label class="label" for="cp-kind">Είδος επιχείρησης</label><select class="input sm" id="cp-kind" data-chg="cpField" data-f="biz.kind">${Object.entries(BIZ_KIND).map(([k,l])=>`<option value="${k}" ${p.biz.kind===k?'selected':''}>${l}</option>`).join('')}</select></div>

  else if(stage==='site')list.forEach(o=>{const r=rentInfo(o);add(r.perm?'3|Μόνιμοι κάδοι':r.over?'0|Κάδοι με επιπλέον χρέωση ημέρας':r.day>=r.incl-1?'1|Τελευταίες ημέρες της τιμής':'2|Εντός ενοικίασης',o)});

  return [...g.entries()].sort((a,b)=>(stage==='done'&&rfSort()==='old'?-1:1)*a[0].localeCompare(b[0])).map(([k,L])=>{const N=stage==='done'&&!ui.co.doneAll?25:400;
    return `<div class="stack-s" style="gap:6px"><span class="label">${esc(k.split('|')[1])} · ${L.length}</span><div class="card rq-list-card">${L.sort(sortIn).slice(0,N).map(o=>reqRow(o)).join('')}</div>${L.length>N?`<button class="btn link" data-act="coSet" data-k="doneAll" data-v="1" style="align-self:flex-start">Εμφάνιση όλων (${L.length})</button>`:''}</div>`}).join('')}

function coAreas(co){

function jobCard(j,m){m=m||{};const pick=j.status.startsWith('pickup'),swp=j.status.startsWith('swap'),sw=j.swap||{};const win=swp?(sw.dateLabel||'')+' · '+(sw.slot||''):pick?'Όσο νωρίτερα':(j.dateLabel||'')+' · '+(j.slot||'');

/* a driver's day: optimised order, arrival estimates, kilometres saved, and the route on the map */
function routeSection(p,title,withMap){if(!p||(!p.stops.length&&!p.active))return '';const save=p.naiveKm-p.km;const n=p.stops.length;
  let h=`<div class="stack-s"><div class="row-wrap between" style="align-items:flex-end"><span class="label">${esc(title)}${p.carried?` · ${p.carried} από προηγούμενη ημέρα`:''}</span><span class="xs muted">${n} ${n===1?'στάση':'στάσεις'} · ${kmTxt(p.km)} · τέλος ~${clk(p.endClock)}</span></div>`;
  if(save>=1&&n>1)h+=`<span class="save-chip" style="align-self:flex-start">Βελτιστοποιημένη σειρά: ${kmTxt(save)} λιγότερα από τη σειρά ανάθεσης</span>`;
  if(withMap){const path=[p.live.pos];const pts=[{...p.depot,kind:'depot',label:'Βάση'}];if(p.active)path.push(geoOf(p.active));
    p.stops.forEach((s,i)=>{if(s.viaBase)path.push(p.depot);const g=geoOf(s.o);path.push(g);pts.push({...g,kind:'num',n:i+1,k:s.kind})});if(n)path.push(p.depot);
    h+=liveMap({pts,trucks:[{tid:trackId(p.cid,p.plate),pos:p.live.pos,state:p.live.state,big:true}],path,h:220,minSpan:.05,aria:'Δρομολόγιο της ημέρας',tag:p.isToday?'Live':''})+(()=>{const K=[...new Set(p.stops.map(s=>s.kind))];return K.length?`<div class="k-legend" aria-label="Υπόμνημα">${[['delivery','Παράδοση'],['pickup','Αποκομιδή'],['swap','Αντικατάσταση']].filter(([k])=>K.includes(k)).map(([k,l])=>`<span><i style="background:var(--k-${k})"></i>${l}</span>`).join('')}</div>`:''})()}
  if(p.active)h+=jobCard(p.active,{note:'Τρέχουσα εργασία'});
  p.stops.forEach((s,i)=>{const notes=[];if(s.viaBase)notes.push('φόρτωση στη βάση πριν');if(s.chained)notes.push('ήδη φορτωμένο από την προηγούμενη στάση');if(s.kind==='pickup'&&s.o.auto&&s.o.auto.combo)notes.push('στην επιστροφή, χωρίς άδεια διαδρομή');else if(s.kind==='pickup'&&!s.viaBase)notes.push('με άδειο φορτηγό');if(s.wait>=5)notes.push('αναμονή '+minTxt(s.wait)+' για το παράθυρο');
    h+=jobCard(s.o,{n:i+1,clock:s.clock,note:notes.length?notes.join(' · ').replace(/^./,c=>c.toUpperCase()):''})});

/* ---------- driver: one job at a time ----------

function drCurrent(did){const jobs=driverJobs(did);const moving=jobs.find(j=>['enroute','arrived','pickup_enroute','swap_enroute'].includes(j.status));if(moving)return{job:moving,jobs};

/* ---------- signature pad ---------- */
let drawing=false,cur=null;const absent={};
function sigCanvas(){return document.getElementById('sig')}
function drawSig(){const c=sigCanvas();if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#111111';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#C9CDD4';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(30,180);ctx.lineTo(570,180);ctx.stroke();
  ctx.strokeStyle='#111111';ctx.lineWidth=3.5;
  (sigs[c.dataset.v]||[]).forEach(s=>{ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(s.length===1)ctx.lineTo(s[0][0]+.1,s[0][1]);ctx.stroke()})}
function sigPt(e){const c=sigCanvas();const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}
document.addEventListener('pointerdown',e=>{if(e.target.id!=='sig')return;e.preventDefault();drawing=true;const id=e.target.dataset.v;sigs[id]=sigs[id]||[];cur=[sigPt(e)];sigs[id].push(cur);try{e.target.setPointerCapture(e.pointerId)}catch(_){}drawSig()});
document.addEventListener('pointermove',e=>{if(!drawing||e.target.id!=='sig')return;cur.push(sigPt(e));drawSig()});
document.addEventListener('pointerup',()=>{if(!drawing)return;drawing=false;cur=null;render()});
document.addEventListener('pointercancel',()=>{if(drawing){drawing=false;render()}});

/* ---------- live loop: moves trucks on screen, detects arrival on the phone that started the trip, runs auto-assignment ---------- */
const sim=new Set(LS.get('sim',[]));let liveSig='';
setInterval(()=>{if(loaded<NEED)return;const now=Date.now();
  sim.forEach(id=>{const o=D.orders[id];if(!o||!['enroute','pickup_enroute','swap_enroute'].includes(o.status)){sim.delete(id);LS.set('sim',[...sim]);return}
    const t=orderTrack(Object.assign({id},o));if(!t||t.state!=='out')return;const n=trackNow(t,now);
    if(!o.nearSent&&t.realMin>6&&n.remain<=4&&n.f<1)patchOrder(id,x=>{x.nearSent=true;ev(x,'driver','Το φορτηγό είναι περίπου '+minTxt(Math.max(1,Math.ceil(n.remain)))+' μακριά')});
    if(n.f>=1){sim.delete(id);LS.set('sim',[...sim]);save('tracks',trackId(t.cid,t.plate),Object.assign({},t,{state:'stop',at:t.path[t.path.length-1]}));
      patchOrder(id,x=>{if(x.status==='enroute')x.status='arrived';x.arrivedAt=nowIso();ev(x,'driver','Το φορτηγό έφτασε στο σημείο')})}});
  autoDispatch();rentReminders();
  let sig='';for(const k in D.tracks){const t=D.tracks[k];const n=trackNow(t,now);sig+=k+t.state+(n.f>=1?1:0)+'|'}
  if(sig!==liveSig){liveSig=sig;scheduleRender();return}
  tickDom(now)},1000);

 * Ανεβάζει αρχείο σε παραγγελία και το καταχωρεί (φωτογραφία ή έγγραφο).
 * @param {import('@supabase/supabase-js').SupabaseClient} supabase
 * @param {string} orderId
 * @param {'waste_photo'|'site_photo'|'delivery_photo'|'delivery_note'|'invoice'|'weigh_ticket'|'mgmt_certificate'} kind
 *   waste_photo, site_photo: ο πελάτης · delivery_photo, delivery_note, weigh_ticket: ο οδηγός · όλα: η εταιρία
 * @param {File|Blob} file
 * @param {{swapId?: string, name?: string, docNumber?: string, docDate?: string, docAmount?: number}} [opt]
 *   docNumber/docDate/docAmount: για παραστατικά (π.χ. { docNumber: 'ΤΠΥ Α-1234', docAmount: 204.60 })
 */
async function uploadOrderFile(supabase, orderId, kind, file, opt = {}) {
  const blob = await shrinkImage(file, PRESETS[KIND_PRESET[kind] || 'photo']);
  checkSize(blob, 'order-files');
  const path = `${orderId}/${kind}/${uid()}.${EXT[blob.type] || 'bin'}`;
  await put(supabase, 'order-files', path, blob);
  const { data, error } = await supabase.rpc('attach_order_file', {
    p_path: path, p_name: opt.name || file.name || null, p_swap: opt.swapId || null,
    p_doc_number: opt.docNumber || null, p_doc_date: opt.docDate || null, p_doc_amount: opt.docAmount ?? null });
  if (error) {
    await supabase.storage.from('order-files').remove([path]);   // μην αφήνεις ορφανό αρχείο
    throw new Error(error.message);
  }
  return data;
}

/**
 * Λογότυπο εταιρίας ({ companyId }) ή πελάτη-επιχείρησης ({ customerId }).
 * @returns {Promise<string>} η δημόσια διεύθυνση του λογοτύπου
 */
async function uploadLogo(supabase, owner, file) {
  const blob = await shrinkImage(file, PRESETS.logo);
  checkSize(blob, 'logos');
  const folder = owner.companyId ? `companies/${owner.companyId}` : `customers/${owner.customerId}`;
  const path = `${folder}/${uid()}.${EXT[blob.type] || 'bin'}`;
  await put(supabase, 'logos', path, blob);
  const { error } = await supabase.rpc('set_logo', { p_path: path });
  if (error) { await supabase.storage.from('logos').remove([path]); throw new Error(error.message); }
  return supabase.storage.from('logos').getPublicUrl(path).data.publicUrl;
}

/**
 * Διεύθυνση για προβολή/λήψη. Τα ιδιωτικά αρχεία παίρνουν προσωρινό σύνδεσμο (1 ώρα).
 */
async function fileUrl(supabase, bucket, path, seconds = 3600) {
  if (bucket === 'logos') return supabase.storage.from('logos').getPublicUrl(path).data.publicUrl;
  const { data, error } = await supabase.storage.from(bucket).createSignedUrl(path, seconds);
  if (error) throw new Error(error.message);
  return data.signedUrl;
}

/** Αφαίρεση αρχείου από παραγγελία (και από τον χώρο αρχείων) */
async function removeOrderFile(supabase, fileRow) {
  const { error } = await supabase.rpc('detach_order_file', { p_file: fileRow.id });
  if (error) throw new Error(error.message);
  await supabase.storage.from('order-files').remove([fileRow.storage_path]);
}

return {shrinkImage, uploadOrderFile, uploadLogo, fileUrl, removeOrderFile};})();

const AUTH_ACTIONS = {
  auSet(el) { AU[el.dataset.k] = el.dataset.v; AU.err = ''; AU.msg = ''; render(); },
  auForgot() { AU.tab = 'forgot'; AU.err = ''; AU.msg = ''; render(); },
  async auLogin() {
    if (!AU.email.trim() || !AU.password) { AU.err = 'Γράψε email και κωδικό'; render(); return; }
    AU.busy = true; AU.err = ''; render();
    const { error } = await SB.auth.signInWithPassword({ email: AU.email.trim(), password: AU.password });
    AU.busy = false;
    if (error) { AU.err = error.message; render(); return; }
    AU.password = ''; await liveAfterLogin();
  },
  async auSignup() {
    const a = AU;
    if (!a.name.trim() || !a.email.trim() || !a.password) { a.err = 'Συμπλήρωσε όνομα, email και κωδικό'; render(); return; }
    if (a.password.length < 8) { a.err = 'Ο κωδικός πρέπει να έχει τουλάχιστον 8 χαρακτήρες'; render(); return; }
    if (!a.terms) { a.err = 'Για την εγγραφή χρειάζεται να αποδεχτείς τους Όρους χρήσης'; render(); return; }
    if (a.kind === 'driver' && !/^\d{6}$/.test(a.code.trim())) { a.err = 'Ο κωδικός πρόσκλησης έχει 6 ψηφία. Ζήτησέ τον από την εταιρία σου.'; render(); return; }
    a.busy = true; a.err = ''; render();
    const data = { full_name: a.name.trim(), phone: a.phone.trim(), account: a.kind, customer_type: a.ctype, terms_version: LG_VERSION };
    if (a.kind === 'driver') data.invite_code = a.code.trim();
    const { data: res, error } = await SB.auth.signUp({ email: a.email.trim(), password: a.password,
      options: { data, emailRedirectTo: location.origin + location.pathname } });
    a.busy = false;
    if (error) { a.err = error.message; render(); return; }
    a.password = '';
    if (res.session) { await liveAfterLogin(); return; }
    a.tab = 'login'; a.msg = 'Σου στείλαμε email στο ' + a.email.trim() + '. Πάτα τον σύνδεσμο για να επιβεβαιώσεις τον λογαριασμό και μετά συνδέσου.';

    AU.busy = false; AU.err = error ? error.message : ''; AU.msg = error ? '' : 'Αν υπάρχει λογαριασμός με αυτό το email, θα λάβεις σύνδεσμο σε λίγο.';

/* ---------- ρόλοι του λογαριασμού ---------- */
async function liveRoles() {
  const uid = LV.user.id;
  const [adm, mem, drv, cus] = await Promise.all([
    SB.from('platform_admins').select('user_id').eq('user_id', uid),
    SB.from('company_members').select('company_id,role').eq('user_id', uid),
    SB.from('drivers').select('id,company_id,is_owner').eq('user_id', uid),
    SB.from('customers').select('id').eq('user_id', uid),
  ]);
  const roles = new Set();
  LV.admin = !!(adm.data && adm.data.length);
  LV.companies = (mem.data || []).map((m) => m.company_id);
  (drv.data || []).forEach(lvDrvKey);
  LV.driverIds = (drv.data || []).map((d) => lvDk(d.id));
  LV.customerId = cus.data && cus.data[0] ? cus.data[0].id : null;
  const meta = (LV.user.user_metadata) || {};
  if (meta.account === 'driver' && !LV.driverIds.length && meta.invite_code) {
    const j = await SB.rpc('join_company', { p_code: meta.invite_code });
    if (!j.error) { LV.driverIds = [lvDk(j.data)]; toast('Μπήκες στην εταιρία σου'); }
    else toast(j.error.message);
    await SB.auth.updateUser({ data: { invite_code: null } });
  }
  if (LV.customerId) roles.add('customer');
  if (LV.companies.length || meta.account === 'company') roles.add('company');
  if (LV.driverIds.length || meta.account === 'driver') roles.add('driver');
  if (LV.admin) roles.add('platform');
  if (!roles.size) roles.add('customer');
  LV.roles = roles;
  if (!roles.has(ui.role)) ui.role = ['company', 'driver', 'customer', 'platform'].find((r) => roles.has(r));
  if (LV.companies.length && !LV.companies.includes(ui.co.id)) ui.co.id = LV.companies[0];
  if (LV.driverIds.length && !LV.driverIds.includes(ui.dr.id)) ui.dr.id = LV.driverIds[0];
  // εταιρία χωρίς στοιχεία ακόμα → οδηγός εγγραφής εταιρίας
  if (meta.account === 'company' && !LV.companies.length) { ui.role = 'company'; if (!ui.co.reg) { A.regStart(); rg.owner = meta.full_name || ''; rg.phone = meta.phone || ''; } }
  persist();
}

/* =====================================================================
   BazaGo · Βήμα 8β — ο πελάτης στην πραγματική βάση
   Κάθε ενέργεια του πελάτη περνά από τις συναρτήσεις του server
   (place_order, cancel_order, request_pickup, …). Ο server ελέγχει
   τιμές, διαθεσιμότητα και δικαιώματα· η εφαρμογή απλώς ξαναφορτώνει.
   ===================================================================== */

/* κλήση στον server → μήνυμα λάθους στα ελληνικά ή ξαναφόρτωμα */
async function lvRpc(fn, args, okMsg) {
  const { data, error } = await SB.rpc(fn, args);
  if (error) { toast(error.message || 'Κάτι πήγε στραβά. Δοκίμασε ξανά.'); return null; }
  await liveLoad();
  if (okMsg) toast(typeof okMsg === 'function' ? okMsg(data) : okMsg);
  return data || true;
}
const lvTomorrow = () => { const d = new Date(); d.setDate(d.getDate() + 1); return ymd(d); };
const lvMunId = (name) => LV.munByName[name] || null;
const lvBusy = new Set();               // μία φορά κάθε ενέργεια (διπλό πάτημα)
async function lvOnce(key, fn) { if (lvBusy.has(key)) return; lvBusy.add(key); try { return await fn(); } finally { lvBusy.delete(key); } }

/* ---------- διαθέσιμες ημέρες: από το πρόγραμμα της εταιρίας ---------- */
LV.days = {};
function lvAvailDays(cid, size) {
  if (!D.companies[cid] || !size) return [];
  const g = cWhereGeo() || {};
  const key = [cid, size, (+g.lat || 0).toFixed(3), (+g.lng || 0).toFixed(3)].join('|');
  const hit = LV.days[key];
  if (hit && Date.now() - hit.at < 120000) return hit.list;
  if (!hit || !hit.loading) {
    LV.days[key] = { list: hit ? hit.list : null, loading: true, at: hit ? hit.at : 0 };
    SB.rpc('available_days', { cid, p_lat: g.lat || null, p_lng: g.lng || null, p_size: size, p_from: lvTomorrow(), p_days: 45, p_kind: 'delivery' })
      .then(({ data, error }) => {
        LV.days[key] = { list: error ? [] : (data || []).map((r) => r.day), loading: false, at: Date.now() };
        render();
      });
  }
  return LV.days[key].list;
}

/* ---------- φωτογραφίες από τη μορφή της εφαρμογής (data:) σε αρχείο ---------- */
async function lvBlob(item) {
  if (item instanceof Blob) return item;
  const r = await fetch(item.src);
  const b = await r.blob();
  return new File([b], item.name || 'φωτογραφία.jpg', { type: b.type || 'image/jpeg' });
}
async function lvUpload(orderId, kind, files) {
  let ok = 0;
  for (const f of files) {
    try { await BF.uploadOrderFile(SB, orderId, kind, await lvBlob(f), { name: f.name }); ok++; }
    catch (e) { toast(e.message || 'Το αρχείο δεν ανέβηκε'); }
  }
  return ok;
}

/* ---------- προφίλ, έργα, αγαπημένες ---------- */
async function lvSaveCustomer(c) {
  const me = D.customer || {}, p = c.profile || {}, b = p.biz || {}, bl = p.bill || {}, pf = p.prefs || {};
  const row = {};
  const put = (k, v) => { if (v !== undefined) row[k] = v === '' ? null : v; };
  put('type', p.type); put('name', c.name || p.name); put('phone', p.phone); put('email', p.email);
  put('biz_name', b.name); put('biz_kind', b.kind); put('afm', b.afm); put('doy', b.doy); put('activity', b.activity); put('biz_address', b.address);
  if (b.logo === null && ((me.profile || {}).biz || {}).logo) row.logo_path = null;
  put('bill_doc', bl.doc); if (bl.other !== undefined) row.bill_same = !bl.other;
  put('bill_name', bl.name); put('bill_afm', bl.afm); put('bill_doy', bl.doy); put('bill_address', bl.address); put('bill_email', bl.email);
  put('pref_street', pf.street); put('pref_notify', pf.notify);
  if (row.name === null) delete row.name;
  const jobs = [SB.from('customers').update(row).eq('id', LV.customerId)];

  // έργα: νέα → καταχώριση, όσα αφαιρέθηκαν → αρχειοθέτηση
  const had = new Set((me.projects || []).map((x) => x.id)), has = new Set((c.projects || []).map((x) => x.id));
  (c.projects || []).filter((x) => !had.has(x.id)).forEach((x) => jobs.push(lvNewProject(x)));
  [...had].filter((id) => !has.has(id)).forEach((id) => jobs.push(SB.from('projects').update({ archived: true }).eq('id', id)));
  // αγαπημένες εταιρίες
  const fa = new Set(me.favs || []), fb = new Set(c.favs || []);
  [...fb].filter((id) => !fa.has(id)).forEach((id) => jobs.push(SB.from('customer_favorites').insert({ customer_id: LV.customerId, company_id: id })));
  [...fa].filter((id) => !fb.has(id)).forEach((id) => jobs.push(SB.from('customer_favorites').delete().eq('customer_id', LV.customerId).eq('company_id', id)));

  const res = await Promise.all(jobs);
  const err = res.find((r) => r && r.error);
  if (err) { toast(err.error.message); await liveLoad(); return false; }
  Object.assign(D.customer, c);           // να φαίνεται αμέσως
  liveLoad();
  return true;
}
function lvNewProject(x) {
  return SB.from('projects').insert({ customer_id: LV.customerId, name: x.name || x.address, address: x.address,
    municipality_id: lvMunId(x.dimos), postcode: x.tk || null, lat: x.geo ? x.geo.lat : null, lng: x.geo ? x.geo.lng : null }).single();
}

/* =====================================================================
   BazaGo · Βήμα 8γ — η εταιρία στην πραγματική βάση
   • Ρυθμίσεις (στοιχεία, ωράριο, ζώνες, τιμές, υλικά, στόλος, οδηγοί,
     άδειες): η εφαρμογή αλλάζει το αντικείμενο της εταιρίας όπως πάντα
     και εδώ βρίσκουμε τι άλλαξε και το γράφουμε στους πίνακες.
   • Παραγγελίες: κάθε ενέργεια περνά από τη συνάρτηση του server
     (accept_order, propose_order, assign_driver, …).
   ===================================================================== */

const lvSlot = (s) => { const m = String(s || '').match(/(\d{1,2}:\d{2})\D+(\d{1,2}:\d{2})/); return m ? [m[1], m[2]] : [null, null]; };
const lvJ = (x) => JSON.stringify(x === undefined ? null : x);
const lvNum = (x) => (x === '' || x == null || isNaN(+x) ? null : +x);
const isUuid = (x) => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(x || ''));
async function lvAll(jobs) {
  const res = await Promise.all(jobs.map((j) => (typeof j === 'function' ? j() : j)));
  const err = res.find((r) => r && r.error);
  return err ? err.error.message : null;
}

/* ---------- εταιρία: τι άλλαξε → πίνακες ---------- */
function lvCompanyRow(co) {
  const H = co.hours || {}, ch = co.chute || {}, pm = co.perm || {};
  return {
    name: co.name, owner_name: co.ownerName, phone: co.phone, depot_name: co.depot,
    depot_lat: co.depotGeo ? co.depotGeo.lat : null, depot_lng: co.depotGeo ? co.depotGeo.lng : null,
    work_days: H.days, work_start: H.start, work_end: H.end, observe_holidays: H.holidays,
    facility_close: co.facilityClose || null, slot_hours: [1, 2, 4].includes(+co.slotLen) ? +co.slotLen : undefined,
    auto_assign: co.autoAssign, combo_pickup: co.comboPickup, solo: co.solo, street_fee: lvNum(co.streetFee),
    chute_on: !!ch.on, chute_price: lvNum(ch.price), chute_max_floor: lvNum(ch.maxFloor), permanent_on: !!pm.on,
  };
}
function lvVehRow(v) {
  return { plate: v.plate, type: v.type || null, carries: v.carries || null, status: v.status || 'active', issue: v.issue || null,
    service_due: v.service || null, kteo_due: v.kteo || null, insurance_due: v.insurance || null,
    max_size_id: v.maxSize || null, slots: Math.max(1, Math.min(6, +v.slots || 1)) };
}

async function lvSaveCompany(cid, n) {
  const o = D.companies[cid];
  if (!o || !isUuid(cid)) return false;
  const jobs = [];

  // 1. στοιχεία και ρυθμίσεις
  const a = lvCompanyRow(o), b = lvCompanyRow(n), patch = {};
  Object.keys(b).forEach((k) => { if (b[k] !== undefined && lvJ(a[k]) !== lvJ(b[k])) patch[k] = b[k]; });
  if (Object.keys(patch).length) jobs.push(SB.from('companies').update(patch).eq('id', cid));

  // 2. έκτακτα κλειστές ημέρες
  const c0 = new Set(o.closed || []), c1 = new Set(n.closed || []);
  [...c1].filter((d) => !c0.has(d)).forEach((d) => jobs.push(SB.from('company_closed_days').insert({ company_id: cid, day: d })));
  [...c0].filter((d) => !c1.has(d)).forEach((d) => jobs.push(SB.from('company_closed_days').delete().eq('company_id', cid).eq('day', d)));

  // 3. υλικά
  Object.entries(n.materials || {}).forEach(([mid, m]) => {
    if (lvJ((o.materials || {})[mid]) === lvJ(m)) return;
    jobs.push(SB.from('company_materials').upsert({ company_id: cid, material_id: mid, enabled: !!m.on, fee: +m.fee || 0 }, { onConflict: 'company_id,material_id' }));
  });

  // 4. μόνιμοι κάδοι
  const p0 = (o.perm || {}).sizes || {}, p1 = (n.perm || {}).sizes || {};
  Object.entries(p1).forEach(([z, p]) => {
    if (lvJ(p0[z]) === lvJ(p)) return;
    if (!(+p.m > 0)) jobs.push(SB.from('permanent_prices').delete().eq('company_id', cid).eq('size_id', z));
    else jobs.push(SB.from('permanent_prices').upsert({ company_id: cid, size_id: z, monthly: +p.m, per_empty: +p.e || 0 }, { onConflict: 'company_id,size_id' }));
  });
  Object.keys(p0).filter((z) => !p1[z]).forEach((z) => jobs.push(SB.from('permanent_prices').delete().eq('company_id', cid).eq('size_id', z)));

  // 5. ζώνες: δήμοι και τιμές
  const z0 = Object.fromEntries((o.areas || []).map((z) => [z.id, z]));
  const z1 = n.areas || [];
  const areaJob = async (z, i) => {
    let id = z.id, old = z0[id];
    if (!old || !isUuid(id)) {
      const r = await SB.from('service_areas').insert({ company_id: cid, name: z.name || 'Ζώνη', active: z.active !== false, sort: i }).single();
      if (r.error) return r;
      id = r.data.id; old = { dimoi: [], prices: {} };
      if (ui.co.area === z.id) { ui.co.area = id; persist(); }
    } else if (old.name !== z.name || old.active !== z.active) {
      const r = await SB.from('service_areas').update({ name: z.name, active: z.active !== false }).eq('id', id);
      if (r.error) return r;
    }
    const d0 = new Set(old.dimoi || []), d1 = new Set(z.dimoi || []);
    const add = [...d1].filter((d) => !d0.has(d)).map((d) => ({ area_id: id, municipality_id: LV.munByName[d] })).filter((x) => x.municipality_id);
    const del = [...d0].filter((d) => !d1.has(d)).map((d) => LV.munByName[d]).filter(Boolean);
    const sub = [];
    if (add.length) sub.push(SB.from('area_municipalities').insert(add));
    if (del.length) sub.push(SB.from('area_municipalities').delete().eq('area_id', id).in('municipality_id', del));
    Object.entries(z.prices || {}).forEach(([size, p]) => {
      if (lvJ((old.prices || {})[size]) === lvJ(p)) return;
      if (!(+p.base > 0)) { sub.push(SB.from('area_prices').delete().eq('area_id', id).eq('size_id', size)); return; }
      sub.push(SB.from('area_prices').upsert({ area_id: id, size_id: size, base: +p.base, extra_per_day: +p.extra || 0,
        swap: p.swap == null || p.swap === '' ? null : +p.swap, included_days: Math.max(1, +p.days || 10) }, { onConflict: 'area_id,size_id' }));
    });
    const r = await Promise.all(sub);
    return r.find((x) => x && x.error) || { error: null };
  };
  z1.forEach((z, i) => jobs.push(() => areaJob(z, i)));
  const keep = new Set(z1.map((z) => z.id));
  Object.keys(z0).filter((id) => !keep.has(id)).forEach((id) => jobs.push(SB.from('service_areas').delete().eq('id', id)));

  // 6. στόλος κάδων (μόνο ελεύθερος ⇄ συντήρηση· οι δεσμεύσεις γίνονται από τις παραγγελίες)
  const bById = Object.fromEntries((o.bins || []).filter((x) => x.id).map((x) => [x.id, x]));
  const newBins = (n.bins || []).filter((x) => !x.id).map((x) => ({ company_id: cid, code: x.code, size_id: x.size, status: x.status === 'service' ? 'service' : 'free', location: x.where || n.depot || 'Αμαξοστάσιο' }));
  for (let i = 0; i < newBins.length; i += 200) jobs.push(SB.from('bins').insert(newBins.slice(i, i + 200)));
  (n.bins || []).filter((x) => x.id && bById[x.id] && bById[x.id].status !== x.status && ['free', 'service'].includes(x.status) && ['free', 'service', 'returning'].includes(bById[x.id].status))
    .forEach((x) => jobs.push(SB.from('bins').update({ status: x.status, location: x.where || null }).eq('id', x.id)));
  const bKeep = new Set((n.bins || []).map((x) => x.id).filter(Boolean));
  Object.keys(bById).filter((id) => !bKeep.has(id)).forEach((id) => jobs.push(SB.from('bins').delete().eq('id', id)));

  // 7. οχήματα
  const v0 = Object.fromEntries((o.vehicles || []).filter((v) => v.id).map((v) => [v.id, v]));
  (n.vehicles || []).forEach((v) => {
    if (!v.id) jobs.push(SB.from('vehicles').insert(Object.assign({ company_id: cid }, lvVehRow(v))));
    else if (v0[v.id] && lvJ(lvVehRow(v0[v.id])) !== lvJ(lvVehRow(v))) jobs.push(SB.from('vehicles').update(lvVehRow(v)).eq('id', v.id));
  });
  const vKeep = new Set((n.vehicles || []).map((v) => v.id).filter(Boolean));
  Object.keys(v0).filter((id) => !vKeep.has(id)).forEach((id) => jobs.push(SB.from('vehicles').delete().eq('id', id)));

  // 8. προσκλήσεις που ακυρώθηκαν
  const i0 = Object.fromEntries((o.invites || []).map((x) => [x.code, x]));
  (n.invites || []).filter((x) => i0[x.code] && x.status === 'cancelled' && i0[x.code].status !== 'cancelled')
    .forEach((x) => jobs.push(SB.from('driver_invites').update({ status: 'cancelled' }).eq('company_id', cid).eq('code', x.code)));

  if (!jobs.length) return true;
  D.companies[cid] = n; render();                 // να φαίνεται αμέσως
  const err = await lvAll(jobs);
  await liveLoad();
  if (err) { toast(lvMsg(err)); return false; }
  return true;
}

/* ---------- οδηγός: στοιχεία, όχημα, άδειες ---------- */
async function lvSaveDriver(key, n) {
  const o = D.drivers[key], co = D.companies[n.companyId || (o || {}).companyId] || {};
  const vid = (p) => ((co.vehicles || []).find((v) => v.plate === p) || {}).id || null;
  if (!o) {
    const cid = n.companyId; if (!isUuid(cid)) return false;
    const r = await SB.from('drivers').insert({ company_id: cid, name: n.name, phone: n.contact || null, default_vehicle_id: vid(n.vehicle),
      is_owner: !!n.owner || key === ownId(cid), online: !!n.online, user_id: key === ownId(cid) ? LV.user.id : null }).single();
    await liveLoad();
    if (r.error) { toast(lvMsg(r.error.message)); return false; }
    return true;
  }
  const id = o.id, jobs = [], patch = {};
  if (n.name !== o.name) patch.name = n.name;
  if ((n.contact || null) !== (o.contact || null)) patch.phone = n.contact || null;
  if ((n.vehicle || '') !== (o.vehicle || '')) patch.default_vehicle_id = vid(n.vehicle);
  if (!!n.online !== !!o.online) patch.online = !!n.online;
  if (Object.keys(patch).length) jobs.push(SB.from('drivers').update(patch).eq('id', id));
  const l0 = Object.fromEntries((o.leaves || []).map((l) => [l.id, l])), l1 = n.leaves || [];
  l1.filter((l) => !l0[l.id]).forEach((l) => jobs.push(SB.from('driver_leaves').insert({ driver_id: id, date_from: l.from, date_to: l.to, type: l.type || 'leave', note: l.note || null })));
  const keep = new Set(l1.map((l) => l.id));
  Object.keys(l0).filter((x) => !keep.has(x)).forEach((x) => jobs.push(SB.from('driver_leaves').delete().eq('id', x)));
  if (!jobs.length) return true;
  D.drivers[key] = n; render();
  const err = await lvAll(jobs);
  await liveLoad();
  if (err) { toast(lvMsg(err)); return false; }
  return true;
}

/* μηνύματα της βάσης που δεν είναι για τον χρήστη → απλά ελληνικά */
function lvMsg(m) {
  m = String(m || '');
  if (/duplicate key|unique/i.test(m)) return 'Υπάρχει ήδη (διπλή καταχώριση)';
  if (/conflicting key value violates exclusion|exclusion constraint/i.test(m)) return 'Η άδεια επικαλύπτει άλλη άδεια του οδηγού';
  if (/row-level security|permission denied/i.test(m)) return 'Δεν έχεις δικαίωμα για αυτή την αλλαγή';
  if (/foreign key/i.test(m)) return 'Δεν γίνεται: χρησιμοποιείται σε παραγγελίες';
  return m;
}

/* ---------- πρόταση ανάθεσης: από τον server, όταν υπάρχει ---------- */
let lvSuggestBase = null;
function lvSuggestFor(o, now, skipDid) {
  const phase = ['pickup', 'pickup_assigned'].includes(o.status) ? 'pickup' : String(o.status).startsWith('swap') ? 'swap' : 'delivery';
  const s = (LV.sugg || []).find((x) => x.order_id === o.id && x.phase === phase && lvDk(x.driver_id) !== skipDid);
  if (s) {
    const did = lvDk(s.driver_id), d = D.drivers[did];
    if (d) { const co = D.companies[o.companyId] || {}; return { did, d, v: (co.vehicles || []).find((v) => v.id === s.vehicle_id) || null, why: s.reason, server: s.id }; }
  }
  return lvSuggestBase(o, now, skipDid);
}

/* ---------- ενέργειες της εταιρίας ---------- */
const LIVE_COMPANY = {
  accept(el) {
    const id = el.dataset.v, o = D.orders[id], f = reqForm[id] || {}, co = D.companies[o.companyId];
    const [ss, se] = lvSlot(f.slot || defSlot(co, 1));
    const tm = f.feeMode === 'ton', fee = tm ? 0 : Math.max(0, Math.round(+f.fee || 0)), ton = tm ? Math.max(0, Math.round((+f.ton || 0) * 100) / 100) : 0;
    return lvOnce('acc' + id, async () => {
      const ok = fee > 0 || ton > 0
        ? await lvRpc('propose_order', { oid: id, p_date: o.date, p_slot_start: ss, p_slot_end: se, p_fee: fee, p_ton_rate: ton || null, p_note: String(f.feeNote || '').trim() || null }, 'Ο πελάτης ενημερώθηκε για την επιπλέον χρέωση')
        : await lvRpc('accept_order', { oid: id, p_slot_start: ss, p_slot_end: se },
            (r) => (r && r.status === 'assigned' && co.solo ? 'Ο πελάτης ενημερώθηκε. Η παράδοση μπήκε στις διαδρομές σου.' : 'Ο πελάτης ενημερώθηκε για ' + o.dateLabel + ', ' + ss + '–' + se));
      if (ok) delete reqForm[id];
    });
  },

  propose(el) {
    const id = el.dataset.v, o = D.orders[id], f = reqForm[id] || {}, co = D.companies[o.companyId];
    const alts = altDates(o.date).filter((x) => worksOn(co, x.id));
    const date = f.altDate || (alts[0] || {}).id; if (!date) { toast('Διάλεξε ημερομηνία'); return; }
    const [ss, se] = lvSlot(f.altSlot || defSlot(co, 1));
    const tm = f.feeMode === 'ton', fee = tm ? 0 : Math.max(0, Math.round(+f.fee || 0)), ton = tm ? Math.max(0, Math.round((+f.ton || 0) * 100) / 100) : 0;
    return lvOnce('pr' + id, async () => {

/* ---------- πραγματικοί χρόνοι οδήγησης (Edge Function «maps» → warm_day) ----------
   Για κάθε ημέρα των επόμενων 7 με εργασίες της εταιρίας, ο server μετρά μία φορά τους χρόνους
   ανάμεσα σε όλες τις στάσεις (OpenRouteService, φορτηγό) και τους κρατά (travel_cache).
   Ξαναμετρά μόνο όταν αλλάξουν οι στάσεις της ημέρας. Αν η υπηρεσία δεν είναι ρυθμισμένη, σταματά αθόρυβα. */
const lvWarmSig = new Map();
let lvWarmOff = false, lvWarmBusy = false, lvWarmFails = 0;
function lvWarmPlan() {
  const own = new Set(LV.companies || []);
  if (!own.size) return [];
  const from = new Date(), to = new Date(); to.setDate(to.getDate() + 7);
  const iso = (d) => d.toISOString().slice(0, 10), lo = iso(from), hi = iso(to);
  const days = {};
  const add = (cid, d, o) => { if (!d || d < lo || d > hi) return; const k = cid + '|' + d; (days[k] = days[k] || []).push(o); };
  Object.entries(D.orders).forEach(([id, o]) => {
    if (!own.has(o.companyId) || ['cancelled', 'rejected', 'declined', 'completed'].includes(o.status)) return;
    const g = o.geo ? `${o.geo.lat.toFixed(3)},${o.geo.lng.toFixed(3)}` : (o.tk || '');
    add(o.companyId, o.date, id + '@' + g);
    add(o.companyId, o.pickupDate, id + 'p@' + g);
    if (o.swap) add(o.companyId, o.swap.date, id + 's@' + g);
  });
  return Object.entries(days).map(([k, v]) => [k, v.sort().join(';')]).filter(([k, sig]) => lvWarmSig.get(k) !== sig);
}
async function lvWarm() {
  if (lvWarmOff || lvWarmBusy || !SB || !LV.user) return;
  const todo = lvWarmPlan();
  if (!todo.length) return;
  lvWarmBusy = true;
  try {
    for (const [k, sig] of todo) {
      const [cid, date] = k.split('|');
      const { data, error } = await SB.functions.invoke('maps', { body: { action: 'warm_day', company_id: cid, date } });
      const msg = (error && (error.message || error)) || (data && data.error) || '';
      if (/Δεν έχει οριστεί|not found|404|Άγνωστη/i.test(String(msg))) { lvWarmOff = true; break; }   // η υπηρεσία δεν έχει στηθεί ακόμα
      if (!msg) lvWarmSig.set(k, sig);
      else if (++lvWarmFails >= 3) { lvWarmOff = true; break; }
    }
  } catch (e) { /* δοκιμάζει ξανά στην επόμενη φόρτωση */ }
  lvWarmBusy = false;
}

/* =====================================================================
   BazaGo · Βήμα 8δ — ο οδηγός στην πραγματική βάση
   • Ξεκινάω / Έφτασα / Ολοκλήρωση → start_trip, arrive, complete_*
   • Φωτογραφία παράδοσης → μικραίνει και ανεβαίνει (delivery_photo)
   • Θέση GPS μόνο όσο ο οδηγός είναι σε διαδρομή → report_position
   • Πελάτης και εταιρία βλέπουν το φορτηγό από τις πραγματικές θέσεις
   ===================================================================== */

const LV_MOVING = ['enroute', 'pickup_enroute', 'swap_enroute'];
LV.photoFile = {};

/* ---------- GPS του οδηγού: ανοίγει μόνο όσο έχει εργασία καθ' οδόν ---------- */
const lvGps = { watch: null, last: 0, sending: false };
function lvMyMovingJob() {
  if (!LV.driverIds || !LV.driverIds.length) return null;
  const mine = new Set(LV.driverIds);
  return Object.entries(D.orders).find(([id, o]) => LV_MOVING.includes(o.status) && mine.has(jobDriver(Object.assign({ id }, o)))) || null;
}
function lvGpsSync() {
  const need = !!lvMyMovingJob();
  if (need && lvGps.watch == null && navigator.geolocation) {
    try {
      lvGps.watch = navigator.geolocation.watchPosition(lvGpsSend, (e) => {
        if (e && e.code === 1) toast('Επίτρεψε την τοποθεσία για να βλέπει ο πελάτης πού είσαι');
      }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    } catch (e) { /* */ }
  } else if (!need && lvGps.watch != null) {
    try { navigator.geolocation.clearWatch(lvGps.watch); } catch (e) { /* */ }
    lvGps.watch = null;
  }
}
async function lvGpsSend(p, force) {
  const now = Date.now();
  if ((!force && now - lvGps.last < 15000) || lvGps.sending) return;
  lvGps.last = now; lvGps.sending = true;
  const c = p.coords;
  try {
    await SB.rpc('report_position', { p_lat: +c.latitude.toFixed(6), p_lng: +c.longitude.toFixed(6),
      p_heading: c.heading == null || isNaN(c.heading) ? null : c.heading, p_speed: c.speed == null || isNaN(c.speed) ? null : Math.round(c.speed * 3.6) });
  } finally { lvGps.sending = false; }
}
function lvGpsNow() {           // αμέσως με το «Ξεκινάω», για να φανεί το φορτηγό χωρίς αναμονή
  try { navigator.geolocation.getCurrentPosition((p) => lvGpsSend(p, true), () => {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }); } catch (e) { /* */ }
}

/* ---------- διαδρομές στον χάρτη από τις πραγματικές θέσεις ---------- */
LV.pos = {};                    // uuid οδηγού → { lat, lng, heading, at }
function lvTracks() {
  const tracks = {};
  Object.entries(D.orders).forEach(([id, o0]) => {
    const o = Object.assign({ id }, o0);
    if (!LV_MOVING.includes(o.status) && o.status !== 'arrived') return;
    const did = jobDriver(o); if (!did) return;
    const co = D.companies[o.companyId]; if (!co) return;
    const plate = o.plate || plateOfDriver(did), tid = trackId(o.companyId, plate);
    const dest = geoOf(o), depot = depotOf(co), p = LV.pos[lvDid(did)];
    const realMin = Math.max(2, driveMin(depot, dest));
    const t = { cid: o.companyId, plate, did, kind: jobKind(o), order: id, path: [depot, dest], carry: [], realMin, startedAt: Date.now(), durMs: 1e12 };
    if (o.status === 'arrived') { t.state = 'stop'; t.at = dest; }
    else {
      t.state = 'out';
      const age = p ? Date.now() - Date.parse(p.at) : Infinity;
      if (p && age < 15 * 60000) t.gps = { lat: p.lat, lng: p.lng, at: Date.now() - Math.min(age, 60000) };
    }
    tracks[tid] = t;
  });
  D.tracks = tracks;
}
function lvOnPosition(row) {
  if (!row || !row.driver_id) return;
  LV.pos[row.driver_id] = { lat: row.lat, lng: row.lng, heading: row.heading, at: row.at };
  lvTracks(); render();
}

   ${f('afm', 'ΑΦΜ', '')}${f('doy', 'ΔΟΥ', '')}${f('address', 'Διεύθυνση', '')}</div></div>`;

LIVE_PLATFORM_CHG.pfSetting = async function (el) {
  const k = el.dataset.k; let v = String(el.value || '').trim();
  if (k === 'iban') v = v.replace(/\s+/g, '').toUpperCase().replace(/(.{4})/g, '$1 ').trim();
  if (k === 'payment_days') { const n = parseInt(v, 10); if (!(n >= 1 && n <= 90)) { toast('Η προθεσμία είναι από 1 έως 90 ημέρες'); return; } v = n; }

/* =====================================================================
   BazaGo · Βήμα 8ζ — ειδοποιήσεις push στο κινητό / στον υπολογιστή
   • «Ενεργοποίηση ειδοποιήσεων στη συσκευή» → άδεια, εγγραφή συσκευής (save_push_subscription)
   • Το κουμπί υπάρχει για όλους τους ρόλους στο καμπανάκι (και στο προφίλ πελάτη)
   • Αποσύνδεση → η συσκευή διαγράφεται, για να μη λαμβάνει ειδοποιήσεις άλλου λογαριασμού
   • Σύνδεσμος ειδοποίησης/email (?o=<παραγγελία>) → ανοίγει την παραγγελία
   Το δημόσιο κλειδί VAPID μπαίνει στο config.js (vapid: '...').
   ===================================================================== */

const LV_DEEP = (() => { try { return new URLSearchParams(location.search).get('o'); } catch (e) { return null; } })();
const lvVapid = () => ((window.BAZAGO_LIVE || {}).vapid || '').trim();
const lvPushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const lvIsIos = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const lvStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;

function lvB64(b64) {
  const pad = '='.repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

async function lvPushSubscribe() {
  const reg = await navigator.serviceWorker.register('sw.js');
  await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (sub) {   // αν άλλαξε το κλειδί VAPID, η παλιά εγγραφή δεν δουλεύει πια
    const k = sub.options && sub.options.applicationServerKey;
    const same = k && btoa(String.fromCharCode(...new Uint8Array(k))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') === lvVapid().replace(/=+$/, '');
    if (k && !same) { await sub.unsubscribe(); sub = null; }
  }
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: lvB64(lvVapid()) });
  const j = sub.toJSON();
  const { error } = await SB.rpc('save_push_subscription', {
    p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_user_agent: navigator.userAgent });
  if (error) throw new Error(error.message);
}

async function lvPushForget(unsubscribe) {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if (!sub) return;
    if (SB && LV.user) await SB.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
    if (unsubscribe) await sub.unsubscribe();
  } catch (e) { /* */ }
}

async function lvOsNotif() {
  if (!lvVapid()) return lvOsNotifBase();
  if (LS.get('osNotif', false)) {
    LS.set('osNotif', false); render();
    await lvPushForget(true);
    toast('Οι ειδοποιήσεις σε αυτή τη συσκευή σταμάτησαν');
    return;
  }
  if (!lvPushOk()) {
    toast(lvIsIos() && !lvStandalone()
      ? 'Στο iPhone: Κοινή χρήση → «Προσθήκη στην οθόνη Αφετηρίας», άνοιξε το BazaGo από εκεί και ξαναπάτα εδώ.'
      : 'Αυτός ο browser δεν υποστηρίζει ειδοποιήσεις. Θα τις βλέπεις στο καμπανάκι.');
    return;
  }
  let p = 'default';
  try { p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission(); } catch (e) { /* */ }
  if (p !== 'granted') {
    toast(p === 'denied' ? 'Οι ειδοποιήσεις είναι μπλοκαρισμένες. Επίτρεψέ τες από τις ρυθμίσεις του browser για το app.bazago.gr.'
                         : 'Δεν δόθηκε άδεια· θα βλέπεις τις ειδοποιήσεις στο καμπανάκι.');
    return;
  }
  try {
    await lvPushSubscribe();
    LS.set('osNotif', true); render();
    toast('Έτοιμο· θα λαμβάνεις ειδοποιήσεις και με κλειστή την εφαρμογή');
  } catch (e) {
    toast('Η ενεργοποίηση δεν ολοκληρώθηκε: ' + (e.message || e));
  }
}
let lvOsNotifBase = null;

// μετά από κάθε σύνδεση: η συσκευή ξαναγράφεται στον λογαριασμό που μπήκε (χωρίς ερώτηση, αφού υπάρχει ήδη άδεια)
async function lvPushSync() {
  if (!lvVapid() || !lvPushOk() || !LS.get('osNotif', false)) return;
  if (Notification.permission !== 'granted') { LS.set('osNotif', false); return; }
  try { await lvPushSubscribe(); } catch (e) { /* */ }
}

// σύνδεσμος ?o=<παραγγελία> από ειδοποίηση ή email
let lvDeepDone = false;
function lvOpenDeep() {
  if (lvDeepDone || !LV_DEEP) return;
  lvDeepDone = true;
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* */ }
  const o = D.orders[LV_DEEP];
  if (!o) return;
  const roles = roleList().map(([r]) => r);
  const role = o.customerId && o.customerId === LV.customerId && roles.includes('customer') ? 'customer'
    : (LV.companies || []).includes(o.companyId) && roles.includes('company') ? 'company'
    : roles.includes('driver') ? 'driver' : ui.role;
  ui.role = role;
  try { A.notifGo({ dataset: { v: LV_DEEP } }); } catch (e) { render(); }
}

function lvNotifFoot() {
  if (!lvVapid()) return '';
  const on = LS.get('osNotif', false);
  return `<div style="padding:8px;border-top:1px solid var(--line)"><button class="btn sm ${on ? '' : 'primary'}" data-act="osNotif" style="width:100%">${
    on ? 'Ειδοποιήσεις σε αυτή τη συσκευή: ενεργές · Διακοπή' : 'Ενεργοποίηση ειδοποιήσεων σε αυτή τη συσκευή'}</button></div>`;
}

function livePushBoot() {
  lvOsNotifBase = A.osNotif;
  A.osNotif = lvOsNotif;
  const basePanel = notifPanel;
  notifPanel = function () {
    const h = basePanel();
    return h.endsWith('</div>') ? h.slice(0, -6) + lvNotifFoot() + '</div>' : h + lvNotifFoot();
  };
  const baseAfter = liveAfterLogin;
  liveAfterLogin = async function () {
    await baseAfter();
    if (LV.user) { lvOpenDeep(); lvPushSync(); }
  };
  const baseLogout = A.auLogout;
  A.auLogout = async function () { await lvPushForget(false); return baseLogout.apply(this, arguments); };
}

      <li><b>Τεχνικά:</b> αν ενεργοποιήσεις ειδοποιήσεις, ένα αναγνωριστικό της συσκευής για push· βασικά στοιχεία σύνδεσης (π.χ. διεύθυνση IP) στα αρχεία καταγραφής των παρόχων μας για λόγους ασφαλείας.</li></ul>`],
    ['3. Γιατί και με ποια νομική βάση', `<ul><li><b>Εκτέλεση σύμβασης</b> (άρθρο 6 παρ. 1β ΓΚΠΔ): λογαριασμός, παραγγελίες, προγραμματισμός, ειδοποιήσεις για την πορεία της παραγγελίας, τιμολόγηση εταιριών.</li>

      <p>Δεν πουλάμε δεδομένα, δεν στέλνουμε διαφημίσεις και δεν κάνουμε αυτοματοποιημένη λήψη αποφάσεων με έννομα αποτελέσματα. Οι προτάσεις ημέρας ή οδηγού είναι βοηθητικές και τις επιβεβαιώνει άνθρωπος.</p>`],
    ['4. Ποιος βλέπει τα δεδομένα', `<ul><li><b>Η εταιρία της παραγγελίας</b> και οι οδηγοί της: όνομα, τηλέφωνο, διεύθυνση, υλικά, φωτογραφίες και στοιχεία τιμολόγησης.</li>

      <li><b>Πάροχοι που εκτελούν την επεξεργασία για λογαριασμό μας</b>, με σύμβαση και μόνο για όσα χρειάζονται:
        <br>· <b>Supabase</b>: βάση δεδομένων, λογαριασμοί, αρχεία, ${LG_DB}.

    ['5. Πόσο τα κρατάμε', `<ul><li><b>Λογαριασμός:</b> όσο είναι ενεργός. Με τη διαγραφή σβήνονται αμέσως τα στοιχεία λογαριασμού, έργα, αγαπημένα, ειδοποιήσεις και συσκευές.</li>

    ['6. Τα δικαιώματά σου', `<p>Έχεις δικαίωμα <b>πρόσβασης, διόρθωσης, διαγραφής, περιορισμού, φορητότητας</b> και <b>εναντίωσης</b> στην επεξεργασία, καθώς και να ανακαλέσεις τη συγκατάθεσή σου.</p>

    ['7. Cookies και αποθήκευση στη συσκευή', `<p>Η εφαρμογή <b>δεν</b> χρησιμοποιεί cookies διαφήμισης ή παρακολούθησης ούτε εργαλεία στατιστικών τρίτων. Αποθηκεύει στη συσκευή σου (local storage) μόνο ό,τι είναι απαραίτητο για να λειτουργεί: τη σύνδεσή σου και ρυθμίσεις όπως η τελευταία καρτέλα. Γι' αυτό δεν χρειάζεται συγκατάθεση για cookies.</p>`],
    ['8. Ασφάλεια', `<p>Η επικοινωνία γίνεται κρυπτογραφημένα (https). Κάθε χρήστης βλέπει μόνο τα δεδομένα που του αναλογούν: οι κανόνες πρόσβασης εφαρμόζονται στη βάση και όχι μόνο στην εφαρμογή. Τα αρχεία των παραγγελιών ανοίγουν μόνο με προσωρινούς συνδέσμους. Αν συμβεί παραβίαση δεδομένων που σε αφορά, θα ενημερώσουμε την Αρχή και εσένα, όπως ορίζει ο νόμος.</p>`],
    ['9. Ανήλικοι', `<p>Η εφαρμογή απευθύνεται σε ενήλικες (18+). Δεν συλλέγουμε εν γνώσει μας δεδομένα ανηλίκων.</p>`],
    ['10. Αλλαγές', `<p>Αν αλλάξει κάτι ουσιαστικό σε αυτή την πολιτική, θα σε ενημερώσουμε μέσα στην εφαρμογή. Ισχύει η έκδοση που εμφανίζεται εδώ.</p>`],

}

    <p class="xs muted" style="margin:0">Έκδοση ${LG_VERSION} · ισχύει από ${LG_DATE}</p>
    ${secs.map(([h, b]) => `<section><h2 class="h3" style="margin:14px 0 6px">${h}</h2><div class="small" style="line-height:1.6">${b}</div></section>`).join('')}
    <button class="btn" data-act="lgBack" style="align-self:flex-start;margin-top:8px">Πίσω</button></article>`;
}

function lgAccount() {
  const u = LV.user || {}, when = LG.accepted ? new Date(LG.accepted).toLocaleDateString('el-GR') : null;
  return `<div class="stack" style="max-width:560px;margin:0 auto">
    <button class="btn link" data-act="lgBack" style="align-self:flex-start">← Πίσω</button>
    <div class="card stack-s"><h1 class="h2" style="margin:0">Λογαριασμός &amp; απόρρητο</h1>
      <div class="kv"><span>Email</span><b>${esc(u.email || '')}</b></div>
      <div class="kv"><span>Όροι χρήσης</span><span>${when ? 'Αποδοχή ' + esc(when) : '—'}</span></div>
      <div class="row-wrap" style="gap:8px"><button class="btn sm" data-act="lgOpen" data-v="terms">Όροι χρήσης</button><button class="btn sm" data-act="lgOpen" data-v="privacy">Πολιτική απορρήτου</button></div></div>
    <div class="card stack-s"><b>Τα δεδομένα μου</b>
      <p class="small muted" style="margin:0">Κατέβασε σε αρχείο ό,τι έχει αποθηκευτεί για εσένα: λογαριασμό, προφίλ, έργα, παραγγελίες με το ιστορικό τους, ειδοποιήσεις.</p>
