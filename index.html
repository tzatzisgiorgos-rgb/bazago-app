/* ---------------------------------------------------------------- ενέργειες */
const LIVE_LEGAL = {
  lgOpen(el) { if (!LG.page || LG.page === 'account') LG.back = LG.page; LG.page = el.dataset.v; window.scrollTo(0, 0); lgLoadInfo(); render(); },
  lgBack() { LG.page = LG.back || null; LG.back = null; window.scrollTo(0, 0); render(); },
  lgAccount() { LG.page = 'account'; LG.back = null; LG.del = ''; window.scrollTo(0, 0); render(); },
  lgTerms() { AU.terms = !AU.terms; AU.err = ''; render(); },
  async lgAccept() {
    LG.busy = true; render();
    const { error } = await SB.rpc('accept_terms', { p_version: LG_VERSION });
    LG.busy = false;
    if (error) { toast(error.message); render(); return; }
    LG.need = false; LG.accepted = new Date().toISOString(); render(); toast('Ευχαριστούμε');
  },
  async lgExport() {
    LG.busy = true; render();
    const { data, error } = await SB.rpc('export_my_data');
    LG.busy = false; render();
    if (error) { toast(error.message); return; }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'bazago-ta-dedomena-mou-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Το αρχείο κατέβηκε');
  },
  async lgDelete() {
    const w = (LG.del || '').trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (w !== 'ΔΙΑΓΡΑΦΗ') { toast('Γράψε ΔΙΑΓΡΑΦΗ στο πεδίο για επιβεβαίωση'); return; }
    LG.busy = true; render();
    const { error } = await SB.rpc('delete_my_account', { p_confirm: 'ΔΙΑΓΡΑΦΗ' });
    LG.busy = false;
    if (error) { render(); toast(error.message); return; }
    LG.page = null; LG.del = '';
    try { await lvPushForget(true); } catch (e) { /* */ }
    try { LS.set('osNotif', false); } catch (e) { /* */ }
    try { await A.auLogout(); } catch (e) { /* ο λογαριασμός έχει ήδη σβηστεί */ }
    AU.msg = 'Ο λογαριασμός σου διαγράφηκε. Ευχαριστούμε που χρησιμοποίησες το BazaGo.'; render();
  },
};

async function lgCheckTerms() {
  if (!LV.user) { LG.need = false; return; }
  try {
    const { data, error } = await SB.from('profiles').select('terms_version,terms_accepted_at').eq('id', LV.user.id).single();
    if (error || !data) { LG.need = false; return; }          // η βάση δεν έχει ακόμα τα πεδία· δεν κλειδώνουμε κανέναν έξω
    LG.accepted = data.terms_accepted_at;
    LG.need = data.terms_version !== LG_VERSION;
  } catch (e) { LG.need = false; }
}

function liveLegalBoot() {
  Object.assign(A, LIVE_LEGAL);
  const baseBody = body;
  body = function () {
    if (LG.page === 'terms') return lgDoc('Όροι χρήσης', lgTerms());
    if (LG.page === 'privacy') return lgDoc('Πολιτική απορρήτου', lgPrivacy());
    if (LG.page === 'account' && LV.user) return lgAccount();
    if (LV.user && LG.need && AU.tab !== 'newpass') return lgGate();
    return baseBody();
  };
  const baseAfter = liveAfterLogin;
  liveAfterLogin = async function () {
    await baseAfter();
    await lgCheckTerms();
    if (LG.need) { lgLoadInfo(); render(); }
  };
  const baseLogout = A.auLogout;
  A.auLogout = async function () { LG.need = false; LG.page = null; LG.accepted = null; return baseLogout.apply(this, arguments); };
}

/* =====================================================================
   BazaGo · Βήμα 9β — Ακριβές σημείο τοποθέτησης στον χάρτη
   • Πελάτης (σε αναμονή / πρόταση / επιβεβαιωμένη / ανατεθειμένη) και εταιρία (πάντα):
     «Ορισμός σημείου στον χάρτη» → χάρτης δρόμων, η πινέζα μένει στο κέντρο,
     μετακινείς τον χάρτη → set_order_location
   • Ο οδηγός πλοηγείται σε αυτό το σημείο (Πλοήγηση → Google Maps με συντεταγμένες)
   • Οι χρόνοι οδήγησης / ο προγραμματισμός χρησιμοποιούν αμέσως τη νέα θέση
   Χάρτης: Leaflet + OpenStreetMap (φορτώνει μόνο όταν ανοίξει το παράθυρο)
   ===================================================================== */

var LVM = { el: null, map: null, loading: null };
const LVM_EDIT = ['pending', 'counter', 'accepted', 'assigned'];
const LVM_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';

function lvmLoad() {
  if (window.L && window.L.map) return Promise.resolve();
  if (LVM.loading) return LVM.loading;
  LVM.loading = new Promise((res, rej) => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = LVM_LIB + 'leaflet.min.css'; document.head.appendChild(l);
    const s = document.createElement('script'); s.src = LVM_LIB + 'leaflet.min.js';
    s.onload = () => res();
    s.onerror = () => { LVM.loading = null; rej(new Error('Ο χάρτης δεν φόρτωσε. Έλεγξε τη σύνδεση και ξαναδοκίμασε.')); };
    document.head.appendChild(s);
  });
  return LVM.loading;
}

const lvExact = (o) => (o.events || []).some((e) => /ακριβές σημείο/i.test(e.text || ''));

// κάρτα στην παραγγελία του πελάτη
function lvPinCard(o) {
  if (!LVM_EDIT.includes(o.status)) return '';
  const ex = lvExact(o);
  return `<div class="card stack-s"><b>Σημείο στον χάρτη</b>
    <span class="xs muted">${ex ? 'Ορίστηκε το ακριβές σημείο. Εκεί θα πλοηγηθεί ο οδηγός.'
      : 'Η θέση βγήκε από τη διεύθυνση και μπορεί να απέχει λίγο. Δείξε στον χάρτη πού ακριβώς θα μπει ο κάδος.'}</span>
    <button class="btn ${ex ? '' : 'primary'}" data-act="pinOpen" data-v="${o.id}" style="align-self:flex-start">${icon.mpin}${ex ? 'Αλλαγή σημείου' : 'Ορισμός σημείου στον χάρτη'}</button></div>`;
}

function lvPinClose() {
  LVM.mark = null;
  if (LVM.map) { try { LVM.map.remove(); } catch (e) { /* */ } }
  if (LVM.el) LVM.el.remove();
  LVM.map = null; LVM.el = null;
  document.removeEventListener('keydown', lvPinKey);
  document.body.style.overflow = '';
}
function lvPinKey(e) { if (e.key === 'Escape') lvPinClose(); }

// οθόνη χάρτη· opts = { lat, lng, exact, sub, onSave(lat, lng) → true αν πέτυχε, view }
// view: η πινέζα μένει καρφωμένη στο σημείο (μόνο προβολή)· «Διόρθωση σημείου» → επεξεργασία
async function lvPinSheet(opts) {
  const g = { lat: opts.lat, lng: opts.lng }, exact = !!opts.exact;
  lvPinClose();
  const box = document.createElement('div');
  box.className = 'pinsheet';
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', 'Σημείο τοποθέτησης στον χάρτη');
  box.style.cssText = 'position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column';
  box.innerHTML = `
    <div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between">
      <div style="min-width:0"><b>Σημείο τοποθέτησης</b><div class="xs muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(opts.sub || '')}</div></div>
      <button class="btn sm" data-pin="close" aria-label="Κλείσιμο">Άκυρο</button></div>
    <div style="position:relative;flex:1;min-height:0">
      <div class="pinmap" style="position:absolute;inset:0;background:#e9ecef"></div>
      <div class="pincenter" aria-hidden="true" style="${opts.view ? 'display:none;' : ''}position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:500;pointer-events:none;color:var(--accent);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))">
        <svg width="40" height="40" viewBox="0 0 24 24"><path fill="currentColor" stroke="#fff" stroke-width="1.2" d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg></div>
      <div class="pinmsg small" style="position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:500;background:var(--card,#fff);color:var(--ink);padding:6px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:calc(100% - 120px);text-align:center">Φόρτωση χάρτη…</div></div>
    <div style="padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn pinv" href="https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lng}" target="_blank" rel="noopener" style="${opts.view ? '' : 'display:none'}">Πλοήγηση</a>
      <button class="btn pinv" data-pin="edit" style="${opts.view ? '' : 'display:none;'}flex:1">Διόρθωση σημείου</button>
      <button class="btn pine" data-pin="gps" style="${opts.view ? 'display:none' : ''}">Η θέση μου</button>
      <button class="btn primary pine" data-pin="save" style="${opts.view ? 'display:none;' : ''}flex:1" disabled>Αποθήκευση σημείου</button></div>`;
  document.body.appendChild(box);
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', lvPinKey);
  LVM.el = box;
  const msg = box.querySelector('.pinmsg'), save = box.querySelector('[data-pin="save"]');
  box.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-pin]'); if (!b) return;
    e.preventDefault(); e.stopPropagation();
    const k = b.dataset.pin;
    if (k === 'close') { lvPinClose(); return; }
    if (k === 'edit' && LVM.map) {          // από προβολή σε επεξεργασία: η πινέζα πάει στο κέντρο, μετακινείται ο χάρτης
      if (LVM.mark) { LVM.map.setView(LVM.mark.getLatLng(), Math.max(LVM.map.getZoom(), 18)); LVM.map.removeLayer(LVM.mark); LVM.mark = null; }
      box.querySelectorAll('.pinv').forEach((x) => { x.style.display = 'none'; });
      box.querySelectorAll('.pine').forEach((x) => { x.style.display = ''; });
      box.querySelector('.pincenter').style.display = '';
      msg.style.display = ''; msg.textContent = 'Μετακίνησε τον χάρτη ώστε η πινέζα να δείχνει το σωστό σημείο και πάτα Αποθήκευση';
      return;
    }
    if (k === 'gps') {
      if (!navigator.geolocation || !LVM.map) return;
      msg.textContent = 'Εντοπισμός θέσης…'; msg.style.display = '';
      navigator.geolocation.getCurrentPosition((p) => {
        if (!LVM.map) return;
        LVM.map.setView([p.coords.latitude, p.coords.longitude], 19);
        msg.textContent = 'Μετακίνησε τον χάρτη αν χρειάζεται, ώστε η πινέζα να δείχνει το σημείο του κάδου';
      }, () => { msg.textContent = 'Δεν βρέθηκε η θέση σου. Μετακίνησε τον χάρτη με το χέρι.'; },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
      return;
    }
    if (k === 'save' && LVM.map) {
      const c = LVM.map.getCenter();
      save.disabled = true; save.textContent = 'Αποθήκευση…';
      const ok = await opts.onSave(+c.lat.toFixed(6), +c.lng.toFixed(6));
      if (ok) lvPinClose(); else { save.disabled = false; save.textContent = 'Αποθήκευση σημείου'; }
    }
  });
  try { await lvmLoad(); } catch (e) { toast(e.message); lvPinClose(); return; }
  if (LVM.el !== box) return;
  const map = window.L.map(box.querySelector('.pinmap'), { zoomControl: true, attributionControl: true }).setView([g.lat, g.lng], exact ? 19 : 17);
  window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(map);
  LVM.map = map;
  setTimeout(() => { try { map.invalidateSize(); } catch (e) { /* */ } }, 50);
  save.disabled = false;
  if (opts.view) {
    LVM.mark = window.L.marker([g.lat, g.lng], { title: 'Σημείο τοποθέτησης' }).addTo(map);
    msg.textContent = exact ? 'Το σημείο που όρισε ο πελάτης' : 'Θέση από τη διεύθυνση (κατά προσέγγιση)';
    return;
  }
  msg.textContent = exact ? 'Μετακίνησε τον χάρτη για να αλλάξεις το σημείο' : 'Μετακίνησε τον χάρτη ώστε η πινέζα να δείχνει πού θα μπει ο κάδος';
  map.once('movestart', () => { msg.style.display = 'none'; });
}

/* =====================================================================
   BazaGo · Βήμα 9γ — Αναζήτηση διεύθυνσης με Google (όπως στο Google Maps)
   • Ο πελάτης γράφει → προτάσεις Google (με αριθμούς, περιοχές, σημεία) μέσω της
     Edge Function «maps» (το κλειδί μένει στον server)
   • Διαλέγει μία → ακριβής θέση + δήμος (από τον Τ.Κ., αλλιώς τον κοντινότερο)
   • Τα έργα του εμφανίζονται πρώτα· πάντα υπάρχει και «Χρήση …» (χειροκίνητα)
   • Αν η υπηρεσία δεν είναι διαθέσιμη, γυρίζει αθόρυβα στον κατάλογο οδών
   ===================================================================== */

var LVA = { on: true, fails: 0, items: {}, busy: {}, sess: {}, timer: null };
const lvaTok = () => { try { return crypto.randomUUID().replace(/-/g, ''); } catch (e) { return (Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 32); } };

function lvaFetch(k, q) {
  clearTimeout(LVA.timer);
  LVA.timer = setTimeout(async () => {
    if ((addrTarget(k).q || '').trim() !== q || LVA.busy[k] === q || (LVA.items[k] && LVA.items[k].q === q)) return;
    if (!LVA.sess[k]) LVA.sess[k] = lvaTok();
    LVA.busy[k] = q; scheduleRender();
    let data = null, error = null;
    try { ({ data, error } = await SB.functions.invoke('maps', { body: { action: 'autocomplete', input: q, session: LVA.sess[k] } })); }
    catch (e) { error = e; }
    LVA.busy[k] = null;
    if (error || !data || data.error) {
      if (++LVA.fails >= 3) LVA.on = false;            // η υπηρεσία δεν απαντά → κατάλογος οδών
      LVA.items[k] = { q, list: null };
    } else {
      LVA.fails = 0;
      LVA.items[k] = { q, list: data.items || [] };
    }
    scheduleRender();
  }, 280);
}
const lvaBusy = (k) => !!LVA.busy[k] && (addrTarget(k).q || '').trim() === LVA.busy[k];

// προτάσεις για τη λίστα· null → η εφαρμογή χρησιμοποιεί τον κατάλογο οδών
function lvaSuggest(k, q0) {
  if (!LVA.on || !SB || !LV.user) return null;
  const q = (q0 || '').trim();
  if (q.length < 2) return [];
  const words = nwords(q), out = [];
  (D.customer.projects || []).forEach((p) => {
    if (words.length && words.every((t) => tokHit(t, nwords(p.name + ' ' + p.address + ' ' + projDimos(p)))))
      out.push({ t: 'saved', p, main: p.name, sub: p.address + ' · ' + projDimos(p), ic: icon.home });
  });
  if (q.length >= 3) {
    const it = LVA.items[k];
    if (it && it.q === q) {
      if (it.list === null) return null;
      it.list.forEach((g) => out.push({ t: 'g', id: g.id, main: g.main, sub: g.sub, ic: icon.mpin }));
    } else {
      if (LVA.busy[k] !== q) lvaFetch(k, q);
      if (it && it.list && q.startsWith(it.q)) it.list.forEach((g) => out.push({ t: 'g', id: g.id, main: g.main, sub: g.sub, ic: icon.mpin }));
    }
    out.push({ t: 'manual', main: 'Χρήση «' + q + '»', sub: 'Δεν βρίσκεις τη διεύθυνση; Θα διαλέξεις μόνο τον δήμο.', ic: icon.search });
  }
  return out;
}

// δήμος από τον Τ.Κ. (κατάλογος οδών)· αν ο Τ.Κ. ανήκει σε πολλούς, ο πλησιέστερος
async function lvaDimos(r) {
  if (r.tk) {
    loadAddr();
    for (let i = 0; i < 40 && !ADDR; i++) await new Promise((res) => setTimeout(res, 200));
    if (ADDR && ADDR.S && ADDR.S.length) {
      const n = {};
      ADDR.S.forEach((s) => { if (s.tk === r.tk) n[s.d] = (n[s.d] || 0) + 1; });
      const ds = Object.keys(n);
      if (ds.length === 1) return ds[0];
      if (ds.length > 1) {
        const dist = (d) => { const c = DCOORD[canon(d)]; return c ? (c[0] - r.lat) ** 2 + ((c[1] - r.lng) * Math.cos(r.lat * Math.PI / 180)) ** 2 : 1e9; };
        return ds.sort((a, b) => dist(a) - dist(b))[0];
      }
    }
  }
  return nearestDimos(r.lat, r.lng) || '';
}

async function lvaPick(k, s) {
  const t = addrTarget(k);
  t.q = ''; render();
  toast('Εύρεση διεύθυνσης…');
  let data = null, error = null;
  try { ({ data, error } = await SB.functions.invoke('maps', { body: { action: 'place', id: s.id, session: LVA.sess[k] } })); }
  catch (e) { error = e; }
  LVA.sess[k] = null; LVA.items[k] = null;
  if (error || !data || data.error) { toast('Η διεύθυνση δεν βρέθηκε. Δοκίμασε ξανά ή γράψε την αλλιώς.'); return; }
  const street = data.route ? data.route + (data.number ? ' ' + data.number : '') : s.main;
  const place = [data.area || data.locality, data.tk].filter(Boolean).join(' ');
  const addr = [street, place].filter(Boolean).join(', ');
  const dimos = await lvaDimos(data);
  applyAddr(k, { addr, dimos, geo: { lat: data.lat, lng: data.lng } });
  const t2 = addrTarget(k);
  t2.gsrc = 1; t2.dimosEdit = !dimos;
  persist(); render();
}

function liveAddressBoot() {
  const basePick = A.acPick;
  A.acPick = function (el) {
    const k = el.dataset.k, s = (acCache[k] || [])[+el.dataset.i];
    if (s && s.t === 'g') return lvaPick(k, s);
    return basePick.apply(this, arguments);
  };
  const baseApply = applyAddr;
  applyAddr = function (k, r) { const t = addrTarget(k); t.gsrc = 0; return baseApply(k, r); };
}

/* =====================================================================
   BazaGo · Βήμα 9δ — «Κάδοι»: πλήρης εικόνα της εταιρίας για τους τοποθετημένους κάδους
   • Σύνοψη στόλου (σε έργο / ελεύθεροι / δεσμευμένοι / συντήρηση)
   • Φίλτρα επείγοντος: επιπλέον ημέρες, λήγουν (από την προτελευταία ημέρα), αποκομιδή,
     αντικατάσταση, μόνιμοι — η λήξη είναι ενημέρωση, όχι αποκομιδή
   • Χάρτης δρόμων (OpenStreetMap) με πινέζα για κάθε τοποθετημένο κάδο + φορτηγά + βάση
   • Λίστα ταξινομημένη κατά επείγον· κάθε κάδος ανοίγει την παραγγελία του
   Ο χάρτης ζει έξω από το render (μετακινείται στη θέση του), για να μη χάνεται το zoom.
   ===================================================================== */

var LVB = { el: null, map: null, layer: null, trucks: null, marks: new Map(), tmarks: new Map(), fitKey: '', loading: null, cluster: false };
const LVB_CL = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/';
const LVB_K = {
  over:   ['Επιπλέον ημέρες', '#DC2626'],
  ending: ['Λήγουν', '#EA8A00'],
  pickup: ['Ζητήθηκε αποκομιδή', '#2563EB'],
  swap:   ['Αντικατάσταση', '#7C3AED'],
  ok:     ['Εντός ημερών', '#16A34A'],
  perm:   ['Μόνιμοι', '#0F766E'],
};
const LVB_ORDER = ['over', 'pickup', 'swap', 'ending', 'ok', 'perm'];

// κατάσταση ενός τοποθετημένου κάδου
function lvbInfo(o) {
  const r = rentInfo(o);
  let k;
  if (String(o.status).startsWith('pickup')) k = 'pickup';
  else if (String(o.status).startsWith('swap')) k = 'swap';
  else if (r.perm) k = 'perm';
  else if (r.over > 0) k = 'over';
  else if (r.left <= 1) k = 'ending';
  else k = 'ok';
  let txt;
  if (r.perm) txt = 'Μόνιμος · από ' + fmtDate(r.start);
  else if (r.over > 0) txt = 'Ημέρα ' + r.day + ' από ' + r.incl + ' · +' + r.over + (r.over === 1 ? ' ημέρα' : ' ημέρες') + (r.cost ? ' (' + eur(r.cost) + ')' : '');
  else if (r.left === 1) txt = 'Ημέρα ' + r.day + ' από ' + r.incl + ' · αύριο η τελευταία';
  else if (r.left <= 0) txt = 'Ημέρα ' + r.day + ' από ' + r.incl + ' · σήμερα η τελευταία';
  else txt = 'Ημέρα ' + r.day + ' από ' + r.incl + ' · ' + r.left + ' ημέρες ακόμα';
  const req = k === 'pickup' ? (STATUS[o.status] || [''])[0] : k === 'swap' ? (STATUS[o.status] || [''])[0] : '';
  return { k, r, txt, req };
}

function lvbPlaced(cid) {
  return ordersArr().filter((o) => o.companyId === cid && RENT_ST.includes(o.status)).map((o) => Object.assign({ info: lvbInfo(o), g: geoOf(o) }, o));
}
const lvbRank = (x) => LVB_ORDER.indexOf(x.info.k) * 1e6 - (x.info.r.over || 0) * 1e3 + (x.info.r.left == null ? 0 : x.info.r.left);

function lvbFilter(list) {
  const f = ui.co.bkF || 'all', sz = ui.co.bkSize || '', q = norm(String(ui.co.bkq || '').trim());
  return list.filter((o) => (f === 'all' || o.info.k === f) && (!sz || String(o.size) === sz)
    && (!q || [o.code, o.binCode, o.customerName, o.address, o.projectName, o.dimos].some((x) => norm(String(x || '')).includes(q))));
}

function lvbPopup(o) {
  const c = LVB_K[o.info.k];
  const nav = 'https://www.google.com/maps/dir/?api=1&destination=' + o.g.lat + ',' + o.g.lng;
  return `<div class="lvb-pop" style="min-width:210px;max-width:260px;display:flex;flex-direction:column;gap:4px;font:13px/1.4 inherit">
    <div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.binCode || '#' + o.code)}</b><span style="color:${c[1]};font-weight:700">${esc(o.info.req || c[0])}</span></div>
    <span>${esc(sizeName(o.size))} · ${esc(matName(o.mat))}</span>
    <span><b>${esc(o.customerName || '')}</b><br>${esc(o.address || '')}</span>
    <span style="color:${o.info.k === 'over' ? c[1] : 'inherit'}">${esc(o.info.txt)}</span>

}

function lvbView(co, cid) {
  const all = lvbPlaced(cid).sort((a, b) => lvbRank(a) - lvbRank(b));

  const urgent = ['over', 'ending', 'pickup', 'swap'].filter((k) => cnt(k));
  const sizes = [...new Set(all.map((o) => String(o.size)))].sort((a, b) => parseFloat(a) - parseFloat(b));
  const row = (o) => {
    const c = LVB_K[o.info.k];
    return `<button class="mb-row lvb-row" data-act="coOpenReq" data-v="${o.id}" style="text-align:left;width:100%;align-items:flex-start;gap:10px">
      <i class="cdot" style="background:${c[1]};margin-top:5px;flex:none"></i>
      <span class="grow" style="min-width:0;display:flex;flex-direction:column;gap:2px">
        <span class="row between" style="gap:8px"><b class="small">${esc(o.binCode || '#' + o.code)} · ${esc(sizeName(o.size))}</b><span class="xs" style="color:${c[1]};font-weight:700;white-space:nowrap">${esc(o.info.req || c[0])}</span></span>
        <span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.customerName || '')} · ${esc(o.address || '')}</span>
        <span class="xs ${o.info.k === 'over' ? '' : 'muted'}" style="${o.info.k === 'over' ? 'color:' + c[1] : ''}">${esc(o.info.txt)}</span></span></button>`;
  };
  return `<div class="stack">
    <div class="card stack-s">
      <div class="row between" style="gap:8px;flex-wrap:wrap"><b>Στόλος κάδων</b><button class="btn link" data-act="lvbFleet">Διαχείριση στόλου</button></div>
      <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(76px,1fr))">
        ${[['Σε έργο', nB('onsite') || all.length], ['Ελεύθεροι', nB('free')], ['Δεσμευμένοι', nB('reserved')], ['Συντήρηση', nB('service')]]
          .map(([l, n]) => `<div class="tile" style="text-align:center"><b class="h2 num">${n}</b><span class="xs muted" style="overflow-wrap:anywhere">${l}</span></div>`).join('')}</div>
      ${urgent.length ? `<div class="stack-s" style="gap:4px">${urgent.map((k) => `<button class="btn link" data-act="coSet" data-k="bkF" data-v="${k}" style="align-self:flex-start;color:${LVB_K[k][1]}"><i class="cdot" style="background:${LVB_K[k][1]}"></i> ${cnt(k)} · ${{ over: 'πέρασαν τις ημέρες ενοικίασης', ending: 'λήγουν σήμερα ή αύριο', pickup: 'ζήτησαν αποκομιδή', swap: 'ζήτησαν αντικατάσταση' }[k]}</button>`).join('')}</div>`
        : '<span class="xs muted">Τίποτα επείγον αυτή τη στιγμή.</span>'}</div>
    <div class="tabs day-chips">${chip('all', 'Όλοι', all.length)}${LVB_ORDER.filter((k) => cnt(k)).map((k) => chip(k, LVB_K[k][0], cnt(k), LVB_K[k][1])).join('')}</div>
    <div class="rq-bar"><div class="search-box grow"><label class="sr" for="bk-q">Αναζήτηση κάδου</label>${icon.search}<input class="input" id="bk-q" data-in="co.bkq" data-live="1" value="${esc(ui.co.bkq || '')}" placeholder="Κάδος, πελάτης ή διεύθυνση" autocomplete="off"></div>
      ${sizes.length > 1 ? `<select class="input sm" data-chg="lvbSize" aria-label="Μέγεθος" style="max-width:140px"><option value="">Όλα τα μεγέθη</option>${sizes.map((s) => `<option value="${esc(s)}" ${ui.co.bkSize === s ? 'selected' : ''}>${esc(sizeName(s))}</option>`).join('')}</select>` : ''}</div>
    <div id="lvb-slot" style="position:relative;z-index:0;isolation:isolate;height:min(56vh,440px);border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#e9ecef"></div>
    <span class="xs muted">Πάτα μια πινέζα για στοιχεία, πλοήγηση και την παραγγελία. ${all.some((o) => !o.geo) ? 'Όσοι κάδοι δεν έχουν ακριβές σημείο φαίνονται στο κέντρο της περιοχής τους.' : ''}</span>
    <div class="stack-s"><span class="label">${list.length} ${list.length === 1 ? 'κάδος' : 'κάδοι'}${f === 'all' ? ' σε έργα' : ' · ' + LVB_K[f][0].toLowerCase()}</span>
      ${list.length ? `<div class="card mb-list">${list.map(row).join('')}</div>` : `<div class="card flat muted small">${all.length ? 'Κανένας κάδος με αυτά τα φίλτρα.' : 'Δεν υπάρχει κάδος τοποθετημένος σε έργο.'}</div>`}</div>
    ${lvbTrucksHtml(co, cid)}</div>`;
}

// τα φορτηγά τώρα (από τον παλιό «Χάρτη στόλου»)
function lvbTrucksHtml(co, cid) {
  let fp = '';
  try { fp = fleetPanel(co, cid); } catch (e) { return ''; }
  const rows = fp.match(/<div class="fl-row">[\s\S]*?<\/span><\/div>/g) || [];
  if (!rows.length) return '';
  return `<div class="stack-s"><span class="label">Φορτηγά τώρα</span><div class="card fl-list">${rows.join('')}</div></div>`;
}

/* ---------------------------------------------------------------- χάρτης */
function lvbLoadCluster() {
  if (window.L && window.L.markerClusterGroup) return Promise.resolve(true);
  if (LVB.loading) return LVB.loading;
  LVB.loading = new Promise((res) => {
    ['MarkerCluster.css', 'MarkerCluster.Default.css'].forEach((f) => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = LVB_CL + f; document.head.appendChild(l); });
    const s = document.createElement('script'); s.src = LVB_CL + 'leaflet.markercluster.js';
    s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s);
  });
  return LVB.loading;
}
function lvbIcon(col, label) {
  return window.L.divIcon({ className: 'lvb-ic', iconSize: [28, 34], iconAnchor: [14, 33], popupAnchor: [0, -30],
    html: `<svg width="28" height="34" viewBox="0 0 28 34" aria-label="${esc(label)}"><path d="M14 33s11-9.6 11-18.5A11 11 0 0 0 3 14.5C3 23.4 14 33 14 33z" fill="${col}" stroke="#fff" stroke-width="2"/><rect x="8.5" y="9" width="11" height="8" rx="1.5" fill="#fff"/></svg>` });
}
const lvbTruckIcon = () => window.L.divIcon({ className: 'lvb-ic', iconSize: [30, 30], iconAnchor: [15, 15],
  html: '<div style="width:30px;height:30px;border-radius:50%;background:#111827;border:2px solid #fff;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.4)"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M3 6h11v9H3zM14 9h4l3 3v3h-7zM6.5 19a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6zm11 0a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6z"/></svg></div>' });
const lvbDepotIcon = () => window.L.divIcon({ className: 'lvb-ic', iconSize: [26, 26], iconAnchor: [13, 13],
  html: '<div style="width:26px;height:26px;border-radius:6px;background:#374151;border:2px solid #fff;display:grid;place-items:center;color:#fff;font:700 12px/1 sans-serif">Β</div>' });

async function lvbEnsureMap() {
  if (LVB.map || LVB.creating) return;
  LVB.creating = true;
  try { await lvmLoad(); } catch (e) { LVB.creating = false; return; }
  LVB.cluster = await lvbLoadCluster();
  const el = document.createElement('div');
  el.style.cssText = 'width:100%;height:100%';
  LVB.el = el;
  const L = window.L;
  LVB.map = L.map(el, { zoomControl: true }).setView([38.0, 23.73], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' }).addTo(LVB.map);
  LVB.layer = LVB.cluster ? L.markerClusterGroup({ maxClusterRadius: 45, showCoverageOnHover: false }) : L.layerGroup();
  LVB.layer.addTo(LVB.map);
  LVB.trucks = L.layerGroup().addTo(LVB.map);
  LVB.creating = false;
  lvbSync();
}

// μετά από κάθε render: ο χάρτης μπαίνει στη θέση του και ενημερώνονται οι πινέζες
function lvbSync() {
  const slot = document.getElementById('lvb-slot');
  if (!slot) return;
  if (!LVB.map) { lvbEnsureMap(); return; }
  if (LVB.el.parentNode !== slot) { slot.appendChild(LVB.el); setTimeout(() => LVB.map && LVB.map.invalidateSize(), 0); }
  const cid = ui.co.id, co = D.companies[cid];
  if (!co) return;
  const L = window.L;
  const list = lvbFilter(lvbPlaced(cid));
  const seen = new Set();
  list.forEach((o) => {
    seen.add(o.id);
    const col = LVB_K[o.info.k][1], sig = o.info.k + '|' + o.g.lat + '|' + o.g.lng + '|' + o.info.txt + '|' + o.status;
    let m = LVB.marks.get(o.id);
    if (!m) { m = L.marker([o.g.lat, o.g.lng], { icon: lvbIcon(col, o.code), title: (o.binCode || '#' + o.code) + ' · ' + (o.address || '') }); m._sig = ''; LVB.marks.set(o.id, m); LVB.layer.addLayer(m); }
    if (m._sig !== sig) { m.setLatLng([o.g.lat, o.g.lng]); m.setIcon(lvbIcon(col, o.code)); m.bindPopup(lvbPopup(o)); m._sig = sig; }
  });
  [...LVB.marks.keys()].forEach((id) => { if (!seen.has(id)) { LVB.layer.removeLayer(LVB.marks.get(id)); LVB.marks.delete(id); } });
  // φορτηγά (μόνο όσα στέλνουν θέση) και βάση
  LVB.trucks.clearLayers();
  const dep = depotOf(co);
  if (dep && isFinite(dep.lat)) L.marker([dep.lat, dep.lng], { icon: lvbDepotIcon(), title: 'Βάση' }).bindPopup('<b>Βάση</b>').addTo(LVB.trucks);
  Object.values(D.tracks || {}).filter((t) => t.cid === cid && t.gps).forEach((t) => {
    L.marker([t.gps.lat, t.gps.lng], { icon: lvbTruckIcon(), title: t.plate }).bindPopup(`<b>${esc(t.plate)}</b><br>${esc(KIND_GR[t.kind] || 'Διαδρομή')}`).addTo(LVB.trucks);
  });
  // κάδρο: μόνο όταν αλλάζουν τα φίλτρα ή την πρώτη φορά, για να μένει το zoom του χρήστη
  const key = cid + '|' + (ui.co.bkF || 'all') + '|' + (ui.co.bkSize || '') + '|' + (ui.co.bkq || '') + '|' + (list.length ? 1 : 0);
  if (key !== LVB.fitKey) {
    LVB.fitKey = key;
    const pts = list.map((o) => [o.g.lat, o.g.lng]);
    if (dep && isFinite(dep.lat) && !(ui.co.bkF && ui.co.bkF !== 'all')) pts.push([dep.lat, dep.lng]);
    if (pts.length > 1) LVB.map.fitBounds(pts, { padding: [36, 36], maxZoom: 16 });
    else if (pts.length === 1) LVB.map.setView(pts[0], 15);
  }
}

function liveBinsBoot() {
  Object.assign(A, {
    lvbFleet() { ui.co.tab = 'profile'; ui.co.pSub = 'fleet'; ui.co.fleetSub = 'bins'; window.scrollTo(0, 0); render(); },
  });
  Object.assign(CHG, { lvbSize(el) { ui.co.bkSize = el.value; render(); } });
  const baseRender = render;
  render = function () {
    const r = baseRender.apply(this, arguments);
    try { lvbSync(); } catch (e) { /* ο χάρτης δεν είναι κρίσιμος για την υπόλοιπη οθόνη */ }
    return r;
  };
}

if(location.hostname==='127.0.0.1')window.__bz={A,CHG,get D(){return D},get ui(){return ui},get LV(){return LV},render,patchCompany,save:(...a)=>save(...a)};
if(window.BAZAGO_LIVE&&window.BAZAGO_LIVE.url)liveBoot();else initStore();
})();
